const ITD={"UI": {"eyebrow": "Guida per l'operatore · modulo 360", "h1": "Guida al modulo 360", "lede": "Tocca un numero sulla schermata, o una voce dell'elenco, per vedere cosa fa ogni controllo.", "planT": "Disponibilità per piano.", "planD": "Alcune funzioni si sbloccano in base al tuo abbonamento. Un badge indica le funzioni che richiedono un piano specifico.", "foot": "Selfie Booth AI · selfieboothapp.com/tutorials · Schermate della versione iOS attuale.", "draft": "Bozza · da confermare", "openScreen": "Apri questa schermata", "tapChipsOv": "Scorri la riga per vedere Upload e Library. Tocca un'opzione qui per leggerne la spiegazione.", "tapChips": "Tocca un controllo sulla schermata. Scorri la riga di lato per vederli tutti. Questo testo cambia di conseguenza.", "tapTabs": "Tocca una scheda sulla schermata. Scorri la barra di lato per vederle tutte e 13. La schermata e questo testo cambiano di conseguenza.", "bgNote": "Sfondo: Event background mantiene il branding che gli ospiti vedono già. Scegli un colore pieno o carica un'immagine per cambiarlo solo in questa schermata.", "grpStart": "Schermata iniziale", "grpFlow": "Percorso dell'ospite", "more": "Vedi dettagli", "screen": "Schermata"}, "SECTIONS": ["Crea evento", "Seleziona funzioni", "Schermate e branding", "Movimento e conto alla rovescia", "Sorgente fotocamera", "Orientamento e qualità", "Speed / Ramp", "Overlays", "Audio", "Condivisione", "Impostazioni galleria", "Share Station", "Raccolta dati", "Revisione", "Avvia evento", "Galleria dell'evento", "Accessi rapidi"], "OVCHIPS": ["Design preimpostati pronti all'uso: cornici e bordi pensati per i video 360. Scegline uno e viene applicato al tuo evento.", "Carica il tuo design: un PNG trasparente, consigliato 1080×1920 px. Ottimo per la grafica brandizzata del cliente.", "Descrivi la cornice che vuoi e l'AI la crea per questo evento."], "CHIPS": ["Passa dalla fotocamera posteriore a quella anteriore.", "Scegli l'obiettivo dell'iPhone: Wide Angle, Ultra Wide, Telephoto, Dual, Dual Wide o Triple. Wide Angle è il più usato per i booth 360.", "Esposizione e messa a fuoco. Auto le regola da sola; manuale le blocca, così l'immagine non cambia mentre il braccio gira.", "Temperatura colore in Kelvin. Impostala in base alle luci della location, così i toni della pelle risultano naturali.", "Sensibilità alla luce. Valori più bassi danno un'immagine più pulita; alzala solo nelle location buie.", "Distanza di messa a fuoco manuale. Impostala dove si trovano gli ospiti sulla piattaforma.", "Risoluzione di registrazione. Il frame rate segue il piano Speed / Ramp dell'evento.", "Modalità di stabilizzazione dell'iPhone durante la registrazione.", "Zoom digitale. Tienilo a 1.0 per l'immagine più nitida.", "Luce fissa accesa o spenta. È diversa dalla Recording Light lampeggiante in Movimento e conto alla rovescia."], "TABS": ["Il tuo logo sulla schermata iniziale: caricalo, mostralo o nascondilo e imposta dimensione e posizione.", "Il pulsante Touch to start: testo (fino a 150 caratteri), mostra o nascondi il testo, peso, dimensione, colore e posizione.", "Il messaggio di benvenuto, per esempio “Welcome to the booth!”: testo, mostra o nascondi, peso, dimensione, colore e posizione.", "Il messaggio di ringraziamento, per esempio “Thanks for visiting!”: testo, mostra o nascondi, peso, dimensione, colore e posizione.", "Attiva Custom Background e scegli Gradient, Image o Video. Per un gradiente, scegli il colore iniziale e quello finale.", "Event Overlay: una cornice sopra l'immagine della fotocamera o lo sfondo che decora senza coprire il centro, dove vanno il testo e il logo. Usa il Default Border (colore e spessore) oppure un PNG Custom: verticale 1668 × 2388 px, orizzontale 2388 × 1668 px, con il centro trasparente.", "Come si muove il pulsante Touch to start: Fade (dissolvenza morbida in entrata e in uscita) o Bounce (rimbalzo giocoso su e giù). Controllalo nell'anteprima.", "Nome della schermata, colore del cerchio del conto alla rovescia e Session Timeout: dopo un periodo di inattività, la schermata iniziale torna come salvaschermo.", "Passo a schermo intero con un grande anello animato mentre la fotocamera si prepara. Imposta il messaggio (per esempio “Initializing Camera...”), il colore del testo, il carattere (System, Serif, Rounded, Mono) e l'ombra del testo.", "Get Ready e conto alla rovescia sopra la vista dal vivo della fotocamera, poi la schermata di registrazione. Imposta il testo, la dimensione e la posizione di Get Ready; il cerchio del conto alla rovescia (gradiente neon o colore pieno, dimensione, colore del numero); e il messaggio di registrazione, il timer e la barra di avanzamento. La durata del conto alla rovescia si imposta in Movimento e conto alla rovescia (Off o 1–10 s).", "Appare mentre il video viene composto ed esportato, con un grande indicatore animato e l'avanzamento in tempo reale. Imposta il messaggio, l'indicatore (anello o barra, gradiente neon, spessore) e lo sfondo.", "L'ospite guarda il video finito e sceglie Retake, Continue o X. La schermata resta finché l'ospite non agisce o scade il timeout di inattività (Off, 5–30 s).", "Qui appaiono solo i canali attivati in Sharing Settings, e una X permette agli ospiti di saltare la condivisione. Imposta il titolo, il sottotitolo, il colore del pulsante di condivisione e il timeout di inattività (Off–60 s). Il timeout riparte a ogni tocco e mostra un conto alla rovescia negli ultimi 5 secondi, poi torna a Touch to start."], "SCREENS": [{"t": "Passo 1 · Dettagli dell'evento", "s": "Dai un nome all'evento, imposta le date e scegli come proteggerlo. Solo il titolo è obbligatorio. Scorri dentro la schermata per vedere tutto.", "hero": "", "tip": "<b>Suggerimento:</b> Ogni campo con l'icona ? ha una guida dedicata nell'app. Tocca Avanti quando hai finito.", "pins": [["Avanzamento della configurazione", "Quattro passi: Crea evento, Seleziona funzioni, Revisione e Avvia evento. Il passo corrente è evidenziato; quelli completati mostrano un segno di spunta."], ["Icona di aiuto", "Tocca ? accanto a un campo per una breve spiegazione di quell'impostazione."], ["Titolo (obbligatorio)", "Fino a 150 caratteri. È il nome che vedrai nel menu degli eventi sul tuo dispositivo. Il campo resta rosso finché non lo compili."], ["Inizia il", "Data di inizio dell'evento (gg/mm/aaaa). Tocca l'icona del calendario per sceglierla."], ["Termina il (facoltativo)", "Data di chiusura dell'evento. Lascialo vuoto se non vuoi che l'evento si chiuda."], ["Descrizione dell'evento", "Note interne facoltative, fino a 500 caratteri: location, cliente, contatto, richieste speciali."], ["Controllo dell'evento · Modalità di protezione", "Richiede un PIN per uscire dalla schermata del booth, così gli ospiti non possono uscire dall'evento né cambiarne le impostazioni. Apri le opzioni dell'evento con il piccolo lucchetto nell'angolo in alto a sinistra della schermata del booth. La modalità Demo o Paid dipende dal tuo abbonamento: senza un abbonamento attivo l'evento funziona in modalità Demo e ogni foto e video riporta una filigrana demo."]]}, {"t": "Passo 2 · Seleziona funzioni", "s": "Ogni card apre un gruppo di impostazioni. Configurale nell'ordine che preferisci. Scorri dentro la schermata per vedere tutte le card.", "hero": "", "tip": "<b>Come cambiano le card:</b> Una card passa da scura a colorata, con un segno di spunta, quando salvi le sue impostazioni: così vedi subito cosa manca.<br><br><b>Regola dei tempi:</b> La durata della registrazione è l'unico dato da impostare. I segmenti la dividono in parti uguali e Bounce riproduce la clip finita avanti e indietro, quindi il risultato dura il doppio della registrazione.<br><br><b>Senza internet?</b> La galleria locale funziona sempre sul dispositivo. La condivisione online resta in coda finché la connessione non torna.", "pins": [["Passo 1 completato", "Il segno di spunta indica che i dettagli dell'evento sono salvati. Ora sei in Seleziona funzioni."], ["Card obbligatoria (✱)", "Le card con l'asterisco vanno configurate prima di poter vedere l'anteprima e avviare l'evento."], ["Schermate", "Branding delle schermate degli ospiti: sfondi, colori, caratteri e pulsanti. Qui appare a colori con il segno di spunta perché è già configurata."], ["Movimento e conto alla rovescia", "Sensore di avvio automatico, conto alla rovescia e luce di registrazione. Il sensore di avvio automatico usa i sensori di movimento dell'iPhone/iPad sulla piattaforma, quindi non si applica quando registri con una GoPro."], ["Sorgente fotocamera", "Scegli la fotocamera del dispositivo o una GoPro, collegata via Wi-Fi o USB, e controlla la vista dal vivo."], ["Orientamento e qualità", "Output verticale, orizzontale o quadrato, più la qualità di esportazione."], ["Speed / Ramp", "Parti da un preset, oppure imposta segmenti con velocità propria (da 0.125x a 8x) ed effetti. Attiva Bounce per l'effetto completo di andata e ritorno."], ["Overlays", "Aggiungi una cornice dalla libreria, carica la tua (PNG, oppure MOV/MP4 con alpha per overlay animati) o generane una con l'AI usando i crediti. Qui puoi aggiungere anche clip di intro e outro. Se un file non corrisponde allo spazio previsto, l'app ti spiega perché."], ["Audio", "Carica fino a 5 brani, riproducili in ordine casuale o fisso e rifila e sincronizza ciascuno."], ["Condivisione", "Attiva QR, email e AirDrop. L'SMS è disponibile con il piano Pro negli Stati Uniti e in Canada."], ["Impostazioni galleria", "Chi può aprire la galleria dell'evento, cosa può scaricare e il PIN che la protegge."], ["Share Station", "Usa un secondo iPad come postazione di condivisione mentre il dispositivo principale continua a registrare. Funziona su rete locale oppure online."], ["Raccolta dati", "Chiedi i dati agli ospiti prima che ricevano il loro video. I dati raccolti sono collegati all'evento e si possono esportare in CSV dalla dashboard web."], ["Salva bozza", "Salva i tuoi progressi per finire la configurazione più tardi."], ["Anteprima", "Quando le card obbligatorie (✱) sono impostate, tocca Preview per passare a Revisione. Le card facoltative, come Audio, possono restare vuote; una obbligatoria, come Sorgente fotocamera, no."]]}, {"t": "2.1 Schermate e branding · Schermata iniziale", "s": "Scegli cosa vedono gli ospiti mentre il booth aspetta la sessione successiva. Con Custom Screen scegli anche quale design mostrare.", "hero": "", "tip": "<b>Suggerimento:</b> Parti da Default Screen per testare subito l'evento, poi passa a Custom Screen per aggiungere il branding del cliente.", "pins": [["Aiuto (?)", "Tocca ? per aprire una breve spiegazione in fondo alla schermata: “Cosa vedono i tuoi ospiti mentre il booth è in attesa.” Scorri il pannello verso il basso per chiuderlo."], ["Default Screen", "Usa la schermata iniziale integrata nell'app. Gli ospiti toccano per avviare la sessione. Ideale quando non ti serve un branding personalizzato."], ["Custom Screen", "Mostra il tuo design mentre il booth aspetta gli ospiti; toccando si avvia la sessione. Il bordo blu e il segno di spunta indicano l'opzione attiva."], ["Scegli il tuo design", "Tocca Select or create a screen per scegliere un design salvato o crearne uno nuovo."]]}, {"t": "2.1 Schermate e branding · Editor della schermata", "s": "Progetta ogni schermata dell'esperienza degli ospiti. L'anteprima in alto si aggiorna mentre modifichi. Scorri verso il basso dentro la schermata e fai scorrere di lato la barra delle schede.", "hero": "", "tip": "<b>Suggerimento:</b> Tocca Save prima di uscire dall'editor.", "pins": [["Anteprima dal vivo", "Mostra come apparirà la schermata iniziale sul booth."], ["Schede dell'editor", "Le schede configurano ogni schermata che vedono gli ospiti, dalla schermata iniziale alla condivisione."], ["Logo", "Il logo in uso. Finché non ne carichi uno, l'app mostra il logo di Selfie Booth (No custom logo). Disattiva Show Logo per nasconderlo."], ["Sostituisci", "Carica il tuo logo. Funziona meglio un PNG con sfondo trasparente."], ["Dimensione", "Larghezza e altezza del logo, in punti."], ["Posizione", "Posizione orizzontale e verticale, da 0 a 1. Orizzontale 0.50 è al centro; un valore verticale basso mette il logo vicino al bordo superiore."], ["Centra · Reimposta · Rimuovi", "Centra sposta il logo al centro. Reimposta riporta dimensione e posizione ai valori predefiniti. Rimuovi toglie il logo dalla schermata."]]}, {"t": "2.2 Movimento e conto alla rovescia", "s": "Decidi come parte la registrazione e come gli ospiti capiscono che sta registrando. Tocca un ? qualsiasi nell'app per una spiegazione rapida.", "hero": "", "tip": "<b>Suggerimento:</b> Con Auto-Start attivo, tieni attivo anche il conto alla rovescia, così gli ospiti hanno il tempo di prepararsi prima che il braccio inizi a girare.", "pins": [["Auto-Start on movement", "La registrazione parte da sola quando il dispositivo rileva movimento, per esempio quando il braccio 360 inizia a girare, così nessuno deve toccare lo schermo. Il conto alla rovescia Get Ready viene comunque eseguito. Usa i sensori di movimento dell'iPhone/iPad, quindi non si applica quando registri con una GoPro."], ["Sensibilità", "Appare quando Auto-Start è attivo. Più alta significa più sensibile: la registrazione parte con movimenti più leggeri."], ["Countdown Before Recording", "Off oppure da 1 a 10 secondi. Gli ospiti vedono il conto alla rovescia Get Ready prima dell'inizio della registrazione."], ["Recording Light", "Solo fotocamera posteriore. Il flash lampeggia durante la registrazione, così ospiti e operatori sanno che è attiva. È diverso dal Flash fisso in Sorgente fotocamera."]]}, {"t": "2.3 Sorgente fotocamera · iPhone", "s": "Usa la fotocamera dell'iPhone o dell'iPad per registrare. Inquadra la piattaforma nella vista dal vivo e regola l'immagine con i controlli sotto.", "hero": "", "tip": "<b>Suggerimento:</b> Imposta i controlli con la luce reale della location, con un ospite sulla piattaforma, prima che l'evento inizi.", "pins": [["iPhone o GoPro", "Scegli quale fotocamera registra il video 360. Tocca GoPro sulla schermata per vedere le sue impostazioni. GoPro è disponibile con il piano Pro.", "Vedi le impostazioni GoPro"], ["Vista dal vivo", "Ciò che la fotocamera vede in questo momento. Usala per inquadrare la piattaforma e gli ospiti."], ["Controlli della fotocamera", "Obiettivo, esposizione, colore, messa a fuoco, risoluzione, stabilizzazione, zoom e flash."], ["Stabilizzazione extra", "Stabilizza il video durante l'elaborazione, non la fotocamera."]]}, {"t": "2.3 Sorgente fotocamera · GoPro", "s": "Registra con una GoPro sul braccio. Risoluzione e frame rate seguono il piano Speed / Ramp dell'evento, come per la fotocamera dell'iPhone. Qui scegli l'obiettivo e la stabilizzazione.", "hero": "", "tip": "<b>Prima volta con una GoPro</b><ol class=\"steps\"><li>Completa la prima configurazione della fotocamera e aggiorna il firmware con l'app GoPro Quik. Lo fai una sola volta.</li><li>Chiudi Quik e scollega la GoPro da qualsiasi altro telefono o iPad. Solo un dispositivo alla volta può controllare una GoPro.</li><li>Metti la GoPro in modalità di associazione. Su HERO12 e HERO13: scorri verso il basso, scorri di lato e tocca Pair Device. Su HERO10 e HERO11: Connections › Connect Device.</li><li>In Selfie Booth scegli GoPro, seleziona la tua fotocamera e tocca Connect.</li><li>Tocca Manage › Test connection prima dell'evento.</li></ol>Dopo di che, basta accendere la GoPro. L'app si ricollega alla ripresa successiva.", "pins": [["GoPro selezionata", "La GoPro registra il video. Gli ospiti vedono il conto alla rovescia e un indicatore di registrazione, ma sullo schermo non c'è l'anteprima dal vivo. Tocca iPhone per tornare indietro.", "Torna a iPhone"], ["Fotocamera associata", "Il modello di GoPro e come è collegata. Tocca Manage sulla schermata per collegare, testare o cambiare la fotocamera.", "Apri Manage"], ["Campo visivo", "Wide è il più usato per i booth 360. Linear elimina la curvatura fisheye, Narrow inquadra più stretto e SuperView è il più ampio."], ["HyperSmooth", "La stabilizzazione propria della GoPro. Disattivala per avere lo slow motion più nitido con un braccio senza vibrazioni."], ["Elimina le clip dalla fotocamera dopo il trasferimento", "Mantiene pulita la scheda SD durante gli eventi lunghi. Ogni clip viene copiata su questo dispositivo e verificata prima di essere eliminata dalla GoPro."], ["Formato di registrazione", "La risoluzione e il frame rate che userà la GoPro, presi da Speed / Ramp."]]}, {"t": "2.3 Sorgente fotocamera · Gestisci GoPro", "s": "Si apre da Manage. Collega, testa o sostituisci la fotocamera. Scorri dentro la schermata per vedere tutto.", "hero": "", "tip": "<b>Internet durante l'evento:</b> mentre la GoPro è collegata via Wi-Fi, l'iPad o l'iPhone è sulla rete Wi-Fi della fotocamera, che non ha internet. La condivisione online e i caricamenti passano dai dati mobili, quindi usa un dispositivo con un piano dati se ti servono durante l'evento.", "pins": [["Fotocamera e stato", "Modello, numero di serie, tipo di connessione e stato (Connecting, Connected). Solo un dispositivo alla volta può controllare una GoPro: scollegala prima da qualsiasi altro iPad."], ["Cambio di Wi-Fi", "Subito dopo la connessione, il dispositivo impiega qualche secondo a cambiare rete e l'app lo aspetta. Aprendo l'editor dell'evento, uscendo dall'evento o toccando Disconnect, torna al Wi-Fi della location. La ripresa successiva ricollega la fotocamera."], ["Connect · Test connection", "Connect collega la fotocamera. Test connection verifica che sia pronta prima dell'arrivo degli ospiti."], ["Associa un'altra GoPro · Dimentica la fotocamera", "Passa a un'altra GoPro, oppure rimuovi questa dall'app."], ["Condividi la diagnostica", "Invia i log di connessione. Usalo quando te li chiede l'assistenza."]]}, {"t": "2.4 Orientamento e qualità", "s": "Imposta dimensione, frame rate e qualità di esportazione del video finale. Tocca un ? qualsiasi nell'app per una spiegazione rapida.", "hero": "", "tip": "", "pins": [["Orientamento", "Verticale 1080×1920, orizzontale 1920×1080, quadrato 1280×1280 o 1080×1080 e rettangolo 1280×720 o 720×1280. La dimensione vale per il video finale, le anteprime, gli overlay e i template, e la nota sotto indica la dimensione consigliata per overlay e intro/outro."], ["Frame rate (output)", "30 o 60 fps per il video finale elaborato. Il frame rate di acquisizione si imposta a parte in Speed / Ramp; con Auto si adatta a questo output."], ["Qualità", "Il bitrate del file esportato: Low 5 Mbps, Medium 8 Mbps, High 12 Mbps, oppure Custom per impostarlo tu. Una qualità più alta dà un video più nitido, ma un file più grande che richiede più tempo per essere condiviso. La dimensione stimata del file appare in Speed / Ramp, sotto il riepilogo dei tempi."]]}, {"t": "2.5 Speed / Ramp · Impostazioni rapide", "s": "Scegli come si muove il video 360: slow motion, fast motion e Boomerang. Quick Settings usa preset già pronti. Scorri dentro la schermata per vedere tutto e tocca qualsiasi ? nell'app per una spiegazione rapida.", "hero": "", "tip": "", "pins": [["Rapide o avanzate", "Quick Settings usa i preset, così non devi costruire la rampa a mano. Advanced Settings ti permette di impostare tu segmenti, tempi, velocità e altro. Tocca Advanced Settings sulla schermata per vederla.", "Vedi Advanced Settings"], ["Scegli una rampa preset", "Scorri i preset di lato, o tocca le frecce gialle, per vedere tutti e 5. Tocca quello che vuoi. Ogni card mostra le sue velocità (tartaruga = lento, coniglio = veloce) e Rec 8s → 16s: tempo di registrazione → tempo del video finale. ↺ indica i preset con Boomerang.", "* Per personalizzare una rampa, vai in Advanced Settings (PRO)."], ["Tempo di registrazione · Test Settings", "Per quanto tempo registra la camera: la somma di tutti i segmenti del preset. Il tempo del video finale si aggiorna da solo. Tocca Test Settings per provare una ripresa con queste impostazioni. Per impostare tu il tempo di registrazione, usa Advanced Settings."], ["Frequenza di cattura", "Lasciala su Auto: l'app sceglie la frequenza di cattura giusta per le velocità e la camera (per esempio, Auto · 120 fps). Puoi anche impostare 30, 60, 120 o 240 fps."], ["Timeline", "Capture è ciò che registra la camera; Output è ciò che viene riprodotto con le velocità applicate. I blocchi tartaruga sono lenti, i blocchi coniglio sono veloci, e ogni blocco mostra la sua durata. In un video Boomerang, un punto di ritorno giallo indica dove tutta la rampa viene riprodotta al contrario fino all'inizio."], ["Timing · Dimensione stimata del file", "Timing mostra il tempo di registrazione (Capture) e il tempo del video finale (Output). Estimated File Size è bitrate × tempo del video finale ÷ 8. Con qualità Medium (8 Mbps) e un video di 16 secondi: 8 × 16 ÷ 8 = 16 MB. Intro e outro si aggiungono al file finale."]]}, {"t": "2.5 Speed / Ramp · Impostazioni avanzate", "s": "Costruisci la tua rampa segmento per segmento. Scorri dentro la schermata per vedere tutto e tocca qualsiasi ? nell'app per una spiegazione rapida.", "hero": "", "tip": "", "pins": [["Advanced Settings", "Le rampe personalizzate sono una funzione Pro. Tocca Quick Settings per tornare ai preset.", "Torna a Quick Settings"], ["Tempo di registrazione", "Total recording time stabilisce per quanto tempo registra la camera. Se lo cambi, tutti i segmenti si scalano in proporzione per mantenere la forma della rampa. Tocca Test Settings per provare una ripresa."], ["Frequenza di cattura", "Come in Quick Settings: lasciala su Auto e l'app sceglie la frequenza di cattura giusta per le tue velocità e la tua camera."], ["Bounce (Boomerang)", "Riproduce il video in avanti e poi al contrario fino all'inizio, un giro completo di andata e ritorno. Ogni segmento viene riprodotto speculare al ritorno, quindi il video finale dura il doppio."], ["Segmenti", "Ogni blocco è una porzione della registrazione con la sua durata, velocità, filtro colore ed effetto. Scorri di lato o tocca le frecce gialle per vedere tutti e 5: il segmento aperto appare grande e gli altri come piccole card. Tocca una card per aprirla. Preview riproduce solo quel segmento nella sua schermata, con gli stessi controlli. Cambiare una durata o una velocità imposta il preset su Custom."], ["Durata", "Quanto tempo di registrazione usa questo segmento. Cambiarla aggiorna il tempo totale di registrazione."], ["Velocità di riproduzione", "Sotto 1x è slow motion, fino a 0.125x; sopra 1x è più veloce, fino a 4x. Si muove a passi di 0.05x; tieni premuto − o + per cambiarla rapidamente. Normal è tempo reale."], ["Filtro colore · Effetto avanzato", "Filtro colore: None, Hue Rotate, RGB Shift, Sepia, Grayscale o Duotone. Effetto avanzato: None, Collage 2x2, Rotate, Tunnel o Tunnel (Frames). Puoi usarne uno di ciascuno sullo stesso segmento."], ["Aggiungi · Rimuovi", "Add aggiunge in coda un segmento di 2 secondi e allunga il tempo di registrazione; Remove ne elimina uno. 5/10 indica quanti segmenti stai usando, su un massimo di 10."], ["Timing · Dimensione stimata del file", "Timing mostra il tempo di registrazione (Capture) e il tempo del video finale (Output). Estimated File Size è bitrate × tempo del video finale ÷ 8. Con qualità Medium (8 Mbps) e un video di 16 secondi: 8 × 16 ÷ 8 = 16 MB. Intro e outro si aggiungono al file finale."]]}, {"t": "2.6 Overlays", "s": "Aggiungi cornici e branding sopra il video. Configura i tuoi overlay, poi usa Preview per vederli applicati sulle tue impostazioni Speed / Ramp. Scorri dentro la schermata per vedere tutto.", "hero": "<div class=\"aihero\"><div class=\"aieyebrow\">✦ AI Overlay <span>Pro</span></div><h3>La cornice del tuo evento, disegnata dall'IA<svg class=\"spark\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10 3l1.6 4.9L16.5 9.5l-4.9 1.6L10 16l-1.6-4.9L3.5 9.5l4.9-1.6z\"/><path d=\"M18 13l.9 2.6 2.6.9-2.6.9L18 20l-.9-2.6-2.6-.9 2.6-.9z\"/><path d=\"M18.5 2.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z\"/></svg></h3><p>Descrivi l'evento e l'IA disegna la cornice per te. Un matrimonio oro e bianco, un compleanno al neon, un lancio nei colori del brand: scrivi l'idea e in pochi secondi hai un overlay unico, fatto per quell'evento. Nome, data e logo vengono aggiunti separatamente, quindi risultano sempre nitidi e precisi.</p><div class=\"aishots\"><figure><img src=\"@aineon\" alt=\"\"><figcaption>“Neon party frame, pink and blue”</figcaption></figure><figure><img src=\"@aigold\" alt=\"\"><figcaption>“Elegant gold wedding frame with leaves”</figcaption></figure></div><div class=\"aifoot\"><span>Esempi illustrativi · Usa crediti IA</span><button type=\"button\" class=\"aigo\" data-go=\"ov2\">Scopri come funziona →</button></div></div>", "tip": "", "pins": [["AI Generate · Upload · Library", "Tre modi per ottenere il tuo Image Overlay. Tocca AI Generate sulla schermata per aprirlo."], ["Image Overlay", "Un PNG trasparente sopra il video, consigliato 1080×1920 px (segue il tuo orientamento). Scegli come ottenerlo nella riga qui sotto."], ["Position", "Main video only mette l'overlay solo sul video 360. Full video copre anche Intro e Outro."], ["Preview", "Mostra l'overlay applicato sulla tua configurazione Speed / Ramp prima dell'evento."], ["Animated Overlay", "Stessa idea dell'Image Overlay, ma animato: un livello video trasparente (MOV/MP4 con canale alpha), consigliato 1080×1920 px. In Library trovi più di 50 overlay animati pronti all'uso, oppure usa Upload per caricare il tuo. Ha una sua impostazione Position."], ["Intro & Outro", "Brevi clip che partono prima e dopo il video principale, in MP4 o JPG. Per un JPG, imposta per quanto tempo viene mostrato; un MP4 usa la sua durata. Le dimensioni di Intro, Outro e overlay devono coincidere. Velocità ed effetti dei segmenti non si applicano mai a loro."]]}, {"t": "2.6 Overlays · Genera con l'IA", "s": "Si apre da AI Generate. Descrivi il design, aggiungi dettagli facoltativi e genera. Tocca Cancel per tornare indietro.", "hero": "<div class=\"aihero slim\"><div class=\"aieyebrow\">✦ Idee per i prompt</div><p>Tocca un'idea per copiarla, poi incollala in Describe Design e rendila tua. Descrivi lo stile: tema, colori, atmosfera. Non serve spiegare le dimensioni o dove si posizionano gli ospiti; l'app aggiunge queste regole per te.</p><div class=\"pchips\"><button type=\"button\" class=\"pchip\">Elegant gold floral frame for a wedding, soft white glow</button><button type=\"button\" class=\"pchip\">Neon 80s party border, pink and blue</button><button type=\"button\" class=\"pchip\">Minimal modern frame with navy corporate accents</button><button type=\"button\" class=\"pchip\">Tropical leaves and sunset colors for a beach party</button><button type=\"button\" class=\"pchip\">Quinceañera frame in rose gold with sparkles</button></div></div>", "tip": "", "pins": [["Dimensione", "L'IA crea l'overlay nell'orientamento e nella dimensione del tuo evento, per esempio Portrait 1080×1920."], ["Describe Design", "Scrivi lo stile che vuoi, per esempio “elegant gold wedding frame with roses”. L'app aggiunge automaticamente le regole tecniche, quindi tu descrivi solo lo stile."], ["Style Reference (facoltativo)", "Carica un'immagine e l'IA genera un design più vicino a quello stile: l'invito di un cliente, un moodboard o un pezzo del brand. Viene ottimizzata automaticamente prima dell'invio."], ["Add name & date", "Aggiungi i nomi e la data. Vengono inseriti dall'app dopo la generazione del design, quindi il testo risulta sempre esatto, senza errori di battitura."], ["Position · Targa · Font", "Scegli dove va il testo; il centro resta libero per i tuoi ospiti. Integrated plate: l'IA crea una targa coordinata con la cornice e ci mette dentro nome e data. Free placement mette il testo da solo. Poi scegli un font."], ["Logo / Image (facoltativo)", "Aggiungi il logo del cliente o un'immagine all'overlay. PNG o JPG; un PNG trasparente funziona meglio."], ["Generate", "Usa 3 crediti IA, addebitati solo dopo che l'overlay diventa un PNG trasparente valido. Il tuo saldo è mostrato qui sotto. Se Add name & date è attivo, inserisci prima un nome o una data, oppure disattivalo. La tua ultima generazione IA viene salvata, così puoi confrontarla con la nuova."]]}, {"t": "2.7 Audio · Casuale", "s": "Aggiungi musica al video 360. Carica fino a 5 tracce e scegli come usarle. Tocca qualsiasi ? nell'app per una spiegazione rapida.", "hero": "", "tip": "", "pins": [["Random o Fixed", "Random: per ogni cattura viene scelta una traccia tra le canzoni che hai caricato, quindi ogni video suona un po' diverso. Tocca Fixed sulla schermata per usare sempre la stessa canzone.", "Vedi Fixed"], ["Add track", "Carica una canzone. Puoi aggiungere fino a 5 tracce; il contatore sopra indica quante ne hai (0/5). Una volta caricata, puoi tagliarla.", "Vedi una traccia caricata"], ["Position", "Main video only lascia Intro e Outro in silenzio. Full video riproduce la traccia in continuo dall'inizio dell'Intro alla fine dell'Outro."]]}, {"t": "2.7 Audio · Fisso", "s": "Ogni cattura usa la stessa canzone. Tocca Random sulla schermata per tornare indietro.", "hero": "", "tip": "", "pins": [["Fixed", "Ogni cattura usa la traccia designata. Dopo aver caricato le canzoni, tocca il cerchio su una traccia per designarla."], ["Add track", "Carica una canzone, fino a 5 tracce.", "Vedi una traccia caricata"], ["Position", "Main video only lascia Intro e Outro in silenzio. Full video riproduce la traccia in continuo dall'inizio dell'Intro alla fine dell'Outro."]]}, {"t": "2.7 Audio · Traccia caricata", "s": "Dopo aver aggiunto una canzone puoi designarla, tagliarla e ascoltarla in anteprima.", "hero": "", "tip": "", "pins": [["Tracce caricate", "1/5 significa che hai una canzone e spazio per altre quattro."], ["Traccia designata", "Con Fixed, il cerchio pieno indica la canzone usata da ogni cattura. Tocca il cerchio su un'altra traccia per cambiarla."], ["Taglia · Preview", "Usa solo una parte della canzone. Sposta Start (verde) e End (rosso), oppure tocca − e + per passi precisi. Plays mostra la parte che verrà usata; tocca Preview per ascoltarla."], ["Remove", "Elimina questa traccia dall'evento."], ["Add track", "Aggiungi altre canzoni, fino a 5 in totale."], ["Position", "Main video only lascia Intro e Outro in silenzio. Full video riproduce la traccia in continuo dall'inizio dell'Intro alla fine dell'Outro."]]}, {"t": "2.8 Condivisione", "s": "Scegli come gli ospiti ricevono il loro video e personalizza l'email che ricevono. Scorri dentro la schermata per vedere tutto e tocca qualsiasi ? nell'app per una spiegazione rapida.", "hero": "<div class=\"netnote\"><b>Niente internet? Non si perde nulla.</b> Le condivisioni via QR, email e SMS restano in coda e l'app le sincronizza automaticamente quando ti riconnetti. AirDrop funziona senza internet. In alcuni casi puoi anche sincronizzare manualmente <a class=\"soonref\" href=\"#eventgallery\">(vedi Galleria dell'evento › Sharing Queue)</a>.</div>", "tip": "", "pins": [["QR Code", "Gli ospiti condividono i loro contenuti in un attimo scansionando un QR code."], ["AirDrop", "Gli ospiti condividono con AirDrop su iPhone, o con Device Sharing su Android. Funziona senza internet."], ["SMS", "Disponibile solo in alcuni paesi: se non lo vedi, non è disponibile nel tuo. Include un numero iniziale di invii SMS e puoi acquistare altri crediti SMS in qualsiasi momento."], ["Email", "Gli ospiti inviano subito le loro foto e i loro video via email."], ["Include Event Logo", "Aggiunge il logo dell'evento all'email."], ["Header Image", "L'immagine in cima all'email. Va bene qualsiasi immagine: viene ridimensionata per adattarsi al layout dell'email (lato lungo 1200 px) prima del caricamento."], ["Include Event Details", "Aggiunge all'email i dettagli dell'evento, come nome e data."], ["Sender name · Reply To", "Sender name è il nome da cui sembra provenire l'email, per le email inviate dall'app e dal web: usa il nome della tua azienda o quello del tuo cliente. Reply To è l'indirizzo email che riceve le risposte."], ["Subject · Message", "L'oggetto e il messaggio dell'email che l'app invia all'ospite."]]}, {"t": "2.9 Impostazioni galleria · Galleria online", "s": "Configura la galleria online dell'evento: chi può vederla, cosa può scaricare e come appare. Scorri dentro la schermata per vedere tutto e tocca qualsiasi ? nell'app per una spiegazione rapida.", "hero": "", "tip": "", "pins": [["Online Gallery · Live Gallery", "Due tab: la galleria online che gli ospiti aprono da un link e la Live Gallery (Pro). Tocca Live Gallery sulla schermata per vederla.", "Vedi Live Gallery"], ["Online Gallery", "Quando è disattivata, il link pubblico alla galleria completa è limitato. Il link personale di ogni ospite, condiviso via QR, email o SMS, continua a funzionare."], ["Gallery Access", "Gallery Link: copia il link della galleria dell'evento e invialo al tuo cliente. Gallery QR: il QR code generale dell'evento, così chiunque può aprire la galleria completa. Manage Web: apre le tue gallerie online sul web così tu, l'operatore, puoi gestirle."], ["Allow Downloads", "Quando è disattivato, i visitatori non possono scaricare i contenuti dalla galleria pubblica."], ["Save Original Media", "Il video elaborato viene sempre salvato. Quando è attivo, viene conservata anche la cattura originale nella cartella Originals dell'evento; rielaborare non la modifica né la elimina mai. Entrambe le cartelle sono incluse nell'esportazione dell'evento."], ["Grid Columns", "Quante colonne mostra la galleria. Auto ne mostra 3 su iPad e desktop, e 2 su telefono."], ["Gallery Background Color", "Sfondo della galleria dell'evento e della Share Station. Default usa il gradiente standard dell'app; Fuchsia o Custom lo cambiano. Le card dei contenuti mantengono il proprio stile."], ["View Gallery in Guest Mode", "Aggiunge una scorciatoia View Gallery in alto a destra nella schermata iniziale e nel selettore delle esperienze, così gli ospiti possono sfogliare la galleria dal totem."], ["Gallery PIN", "Più in basso, puoi richiedere un PIN di 6 cifre per aprire la galleria pubblica. I visitatori devono inserirlo prima di vedere qualsiasi contenuto."]]}, {"t": "2.9 Impostazioni galleria · Live Gallery", "s": "Proietta le foto e i video dell'evento come presentazione su una TV o un display esterno. Configurala qui, poi avviala. Tocca Online Gallery sulla schermata per tornare indietro.", "hero": "", "tip": "", "pins": [["Live Gallery", "Una funzione Pro: una presentazione live dell'evento per una TV o un display esterno."], ["Launch Live Gallery", "Apre la presentazione con le impostazioni di questo tab. Usalo per proiettare la galleria dell'evento su una TV o un display esterno. Tocca Live Gallery sulla schermata per vedere come collegarla.", "Vedi come collegarla"], ["Slide Duration · Transition", "Per quanto tempo ogni slide resta sullo schermo (3, 5, 8 o 10 s) e come passa alla successiva: Fade, Slide o Zoom."], ["Video Playback", "Play Full Video mostra ogni video fino alla fine. Limit to Slide Duration lo taglia alla durata della slide, così la presentazione mantiene un ritmo costante."], ["Shuffle", "Mostra i contenuti in ordine casuale."], ["Continue in Background", "Mantiene attivi la presentazione e il server quando esci dalla schermata Live Gallery."], ["Background", "Il colore di sfondo della presentazione: Black, Dark Gray, Navy, Green, Maroon, Purple o un colore personalizzato."], ["Logo · Event name · QR code", "Mostra il logo e il nome dell'evento sopra la presentazione, più un QR code che gli ospiti possono scansionare per aprire la galleria dell'evento."]]}, {"t": "2.9 Live Gallery · Collegare a una TV", "s": "Si apre da Live Gallery. Collega il display, avvia la presentazione e tieni i controlli sull'iPad.", "hero": "", "tip": "", "pins": [["Preview", "Ciò che la TV sta mostrando. Il QR code permette agli ospiti di aprire la galleria dell'evento sul loro telefono."], ["Evento ed elementi", "Il nome dell'evento e quante foto e video ci sono nella presentazione. Tocca X per chiudere questa schermata."], ["Adattatore HDMI / USB-C", "Collega un adattatore: la presentazione appare automaticamente sulla TV mentre tu tieni i controlli sull'iPad."], ["AirPlay", "Scorri verso il basso dall'angolo in alto a destra, tocca Screen Mirroring e seleziona la tua TV, poi tocca Enter Fullscreen."], ["Enter Fullscreen", "Mostra la presentazione a schermo intero, per AirPlay o per l'iPad stesso."], ["Local Network", "Apri la presentazione in qualsiasi browser collegato allo stesso Wi-Fi, per esempio su una smart TV o un laptop."], ["Slideshow & Branding", "Tempi, transizioni, branding e overlay del QR si impostano in Gallery Settings › Live Gallery quando crei o modifichi l'evento. Tocca questa card sulla schermata per andarci.", "Vai alle impostazioni di Live Gallery"], ["Play · Minimize · Stop & Exit", "Play avvia la presentazione. Minimize nasconde questa schermata mentre la presentazione continua. Stop & Exit termina la presentazione e chiude Live Gallery."]]}, {"t": "2.10 Share Station", "s": "Usa un secondo dispositivo come postazione dove gli ospiti vedono e condividono i loro video, mentre il booth continua a registrare. Scorri dentro la schermata per vedere tutte le impostazioni.", "hero": "<div class=\"sshero\"><div class=\"aieyebrow\">Share Station <span>Enterprise</span></div><h3>Due dispositivi, un evento</h3><div class=\"devflow\"><div class=\"dev dphone\"><div class=\"scr\"><i class=\"rec\"></i></div><b>Dispositivo 1</b><small>iPhone o iPad · Booth</small><em>Registra il video 360</em></div><div class=\"flowarrow\"><span>Stesso account · Stesso evento</span><svg viewBox=\"0 0 120 24\" aria-hidden=\"true\"><path d=\"M2 12h110\" stroke-dasharray=\"5 5\"/><path d=\"M104 5l10 7-10 7\"/></svg></div><div class=\"dev dtablet\"><div class=\"ipad\"><span class=\"cam\"></span><div class=\"scr grid\"><i class=\"v1\"></i><i class=\"v2\"></i><i class=\"v3\"></i><i class=\"v4\"></i><i class=\"v5\"></i><i class=\"v6\"></i></div></div><b>Dispositivo 2</b><small>iPad o iPhone · Share Station</small><em>Gli ospiti vedono e condividono</em></div></div><div class=\"netnote ssnet\"><b>Servono internet su entrambi i dispositivi.</b> Il dispositivo 1 e il dispositivo 2 devono essere online perché i video arrivino alla Share Station.</div><div class=\"sshead\">Come configurarla</div><ol class=\"sssteps\"><li>Sul <b>dispositivo 1</b>, dove configuri l'evento, attiva <b>Enable Share Station</b> e tocca Confirm.</li><li>Sul dispositivo 1, avvia l'evento. Quando appare la finestra, scegli <b>Capture Station</b> (questo dispositivo registra soltanto) oppure <b>Everything</b> (registra e gli ospiti possono condividere anche qui).</li><li>Sul <b>dispositivo 2</b>, scarica Selfie Booth AI e accedi con la <b>stessa email e password</b>.</li><li>Sul dispositivo 2, apri lo <b>stesso evento</b> e scegli <b>Share Station</b>.</li><li>Se hai attivato Input PIN, inserisci il PIN di 6 cifre.</li><li>Il dispositivo 2 passa alla <b>modalità kiosk</b> e riceve automaticamente ogni nuova foto, video e GIF, così gli ospiti possono vederli e condividerli.</li></ol></div>", "tip": "", "pins": [["Come funziona Share Station", "Tocca ? per il riepilogo passo per passo mostrato qui sopra."], ["Enable Share Station", "Permette agli ospiti di condividere i loro contenuti in una postazione dedicata, o direttamente subito dopo la cattura."], ["Input PIN", "Un PIN di 6 cifre per la Share Station. Sul dispositivo 2, toccare la freccia indietro in alto a sinistra richiede il PIN, così gli ospiti non possono uscire dalla Share Station."], ["Video Columns", "Quante colonne mostra la griglia della Share Station. Auto ne mostra 3 su iPad e 2 su telefono."], ["Capture Station Instructions", "Il messaggio mostrato nella schermata di ringraziamento quando il booth è in modalità Capture Station, per esempio “Find your photos at the Share Station near the bar.”"], ["Guest Messages", "Testi mostrati sulla Share Station. Welcome: quando un ospite si avvicina. Empty Gallery: quando non c'è ancora nulla da condividere. Processing: mentre prepara i contenuti o contatta un servizio di condivisione. Sharing Success: quando una condivisione via email, SMS o AirDrop è completata. Sharing Error: quando la condivisione fallisce. Lascia vuoto un campo per usare il testo predefinito dell'app."]]}, {"t": "2.11 Raccolta dati", "s": "Chiedi agli ospiti le loro informazioni prima o dopo la registrazione, per esempio nome, email o telefono. Scorri dentro la schermata per vedere tutto.", "hero": "", "tip": "", "pins": [["Enable Data Capture", "Attiva il questionario per gli ospiti di questo evento."], ["Survey Timing", "Before Capture: gli ospiti lo compilano prima di registrare. After Capture: dopo la registrazione, prima di ricevere il loro video."], ["Survey Fields", "Le domande che hai aggiunto, in ordine. Parte vuoto."], ["Add Field", "Tocca un tipo per aggiungere una domanda: Text, Email, Phone, Date, Multiple Choice o Checkbox."], ["GDPR Consent", "Richiede che gli ospiti accettino un consenso sulla privacy prima di continuare."], ["GDPR Description", "Appare solo quando GDPR Consent è attivo. Il testo che gli ospiti vedono quando accettano; è già compilato e puoi modificarlo (fino a 500 caratteri)."]]}, {"t": "3 Revisione", "s": "Un riepilogo di tutto ciò che hai configurato, scheda per scheda. Controllalo, poi salva. Scorri dentro la schermata per vedere tutto.", "hero": "", "tip": "", "pins": [["Evento e numeri chiave", "Nome, data e luogo dell'evento, più durata del video finale, opzioni di condivisione, tracce audio e raccolta dati a colpo d'occhio."], ["Una scheda per impostazione", "Controllo dell'evento, fotocamera, velocità, percorso dell'ospite, overlay, audio, raccolta dati e condivisione. Per cambiare qualcosa, torna a Select Features."], ["Salva l'evento", "Salva l'evento e ti porta a Launch. In un evento che stai modificando, il pulsante dice Update Event.", "Vai a Launch"]]}, {"t": "4 Avvia evento · I tuoi eventi", "s": "L'evento salvato compare in Your Events. Avvialo da qui.", "hero": "", "tip": "", "pins": [["Menu ⋮", "Edit, Gallery, Analytics, Duplicate, Close o Delete dell'evento.", "Vedi il menu ⋮"], ["Gallery · Metriche", "Uno sguardo rapido a quanti media e condivisioni ha l'evento."], ["Start Event", "Avvia l'evento su questo dispositivo. Tocca Start Event sullo schermo.", "Avvia l'evento"]]}, {"t": "4 Avvia evento · Ruolo del dispositivo", "s": "La prima volta che avvii un evento su un dispositivo, scegli il suo ruolo. Dopo, l'evento si carica e basta.", "hero": "", "tip": "", "pins": [["Everything · Capture Station · Share Station", "Everything: questo dispositivo registra e gli ospiti condividono qui. Capture Station: registra soltanto; gli ospiti condividono su una Share Station separata. Share Station: mostra soltanto la galleria perché gli ospiti condividano."], ["Start Event", "Carica l'evento.", "Continua"]]}, {"t": "4 Avvia evento · Pronto", "s": "L'app scarica i file dell'evento per funzionare offline. Tocca Continue per aprire la schermata iniziale del booth.", "hero": "", "tip": "", "pins": [["Continue", "Apre la schermata iniziale. Il tuo booth è attivo.", "Vedi la schermata iniziale"]]}, {"t": "5 Galleria dell'evento · Aprirla", "s": "Controlla gli invii, recupera la coda e scarica tutto dalla galleria dell'evento. Nella schermata degli eventi, tocca il menu ⋮ dell'evento e scegli Gallery. Durante l'evento puoi aprirla anche dall'icona della galleria in alto a destra nella schermata iniziale (vedi <a href=\"#quick\">Accessi rapidi</a>).", "hero": "<div class=\"scenbox\"><div class=\"scenhead\"><b>Situazioni comuni</b> Tocca una voce per andare alla schermata giusta. Percorso: ⋮ dell'evento › Gallery.</div><div class=\"scengrid\"><button type=\"button\" class=\"scen aigo2\" data-go=\"eg2b\"><b>Un ospite torna a cercare il     const u2=()=>{stripScroll[S.id]=ss.scrollLeft;scr.classList.toggle("stripmoved",ss.scrollLeft>8);hr.classList.toggle("dim",ss.scrollLeft+ss.clientWidth>=ss.scrollWidth-4);hl2.classList.toggle("dim",ss.scrollLeft<4);
      th.style.width=(ss.clientWidth/ss.scrollWidth*100)+"%";th.style.left=(ss.scrollLeft/ss.scrollWidth*100)+"%"};

    hr.onclick=()=>ss.scrollBy({left:ss.clientWidth*0.6,behavior:"smooth"});hl2.onclick=()=>ss.scrollBy({left:-ss.clientWidth*0.6,behavior:"smooth"});}
  {const sec2=secOf(cur),ids=sec2?sec2.screens:[cur],k=ids.indexOf(cur);$("dots").innerHTML=ids.length>1?ids.map(i=>`<span class="${i===cur?'on':''}"></span>`).join(""):"";$("dots").title=`${UI[lang].screen} ${k+1}/${ids.length}`;}
  $("prev").disabled=cur===0;$("next").disabled=cur===SCREENS.length-1;
}
function selBand(key,j,fromList){bsel[key]=j;const pi=pinsOf(SCREENS[cur]).findIndex(p=>p.bandPin);sel=pi;render();

  if(fromList){const sc=$("scroller"),pe=$("screen").querySelector(".tabband");if(pe)sc.scrollTo({top:pe.offsetTop-sc.clientHeight/3,behavior:"smooth"})}}

function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
function goId(id){const i=SCREENS.findIndex(s=>s.id===id);if(i>=0)go(i)}
function go(i){cur=Math.max(0,Math.min(SCREENS.length-1,i));sel=-1;$("scroller").scrollTop=0;const s=secOf(cur);try{history.replaceState(null,"","#"+s.id)}catch(e){}render()}
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("sbai-lang",lang)}catch(e){}render()});
function fromHash(){const h=location.hash.slice(1);const s=SECTIONS.find(x=>x.id===h&&x.screens.length);if(s){cur=s.screens[0];sel=-1}render()}

 if(d.sbai==="go"){const s=SECTIONS.find(x=>x.id===d.id&&x.screens.length);if(s){cur=s.screens[0];sel=-1;render()}}});
