const FRD={"UI": {"eyebrow": "Guide de l'opérateur · module 360", "h1": "Guide du module 360", "lede": "Touchez un numéro à l'écran, ou un élément de la liste, pour voir ce que fait chaque contrôle.", "planT": "Disponibilité selon le plan.", "planD": "Certaines fonctions se débloquent selon votre abonnement. Un badge signale les fonctions qui nécessitent un plan précis.", "foot": "Selfie Booth AI · selfieboothapp.com/tutorials · Écrans de la version iOS actuelle.", "draft": "Brouillon · à confirmer", "openScreen": "Ouvrir cet écran", "tapChipsOv": "Faites glisser la rangée pour voir Upload et Library. Touchez une option ici pour lire son explication.", "tapChips": "Touchez un contrôle à l'écran. Faites glisser la rangée sur le côté pour les voir tous. Ce texte change en fonction du contrôle.", "tapTabs": "Touchez un onglet à l'écran. Faites glisser la barre sur le côté pour voir les 13. L'écran et ce texte changent en fonction de l'onglet.", "bgNote": "Fond : Event background conserve le branding que l'invité voit déjà. Choisissez une couleur unie ou importez une image pour le modifier uniquement sur cet écran.", "grpStart": "Écran d'accueil", "grpFlow": "Parcours de l'invité", "more": "Voir le détail", "screen": "Écran"}, "SECTIONS": ["Créer un événement", "Sélectionner les fonctions", "Écrans et branding", "Mouvement et compte à rebours", "Source caméra", "Orientation et qualité", "Speed / Ramp", "Overlays", "Audio", "Partage", "Réglages de la galerie", "Share Station", "Collecte de données", "Vérification", "Lancer l'événement", "Galerie de l'événement", "Accès rapides"], "OVCHIPS": ["Designs preset prêts à l'emploi : cadres et bordures conçus pour les vidéos 360. Choisissez-en un et il s'applique à votre événement.", "Importez votre propre design : un PNG transparent, 1080×1920 px recommandé. Idéal pour l'illustration aux couleurs du client.", "Décrivez le cadre que vous voulez et l'IA le crée pour cet événement."], "CHIPS": ["Basculez entre la caméra arrière et la caméra avant.", "Choisissez l'objectif de l'iPhone : Wide Angle, Ultra Wide, Telephoto, Dual, Dual Wide ou Triple. Wide Angle est le plus utilisé pour les booths 360.", "Exposition et mise au point. En automatique, elles s'ajustent seules ; en manuel, elles sont verrouillées pour que l'image ne change pas pendant que le bras tourne.", "Température de couleur en Kelvin. Réglez-la sur l'éclairage du lieu pour que les teintes de peau paraissent naturelles.", "Sensibilité à la lumière. Les valeurs basses donnent une image plus propre ; ne l'augmentez que dans les lieux sombres.", "Distance de mise au point manuelle. Réglez-la sur l'endroit où se placent les invités sur la plateforme.", "Résolution d'enregistrement. Le nombre d'images par seconde suit le plan Speed / Ramp de l'événement.", "Mode de stabilisation de l'iPhone pendant l'enregistrement.", "Zoom numérique. Laissez-le à 1.0 pour l'image la plus nette.", "Lumière constante allumée ou éteinte. C'est différent du Recording Light clignotant dans Motion & Countdown."], "TABS": ["Votre logo sur l'écran d'accueil : importez-le, affichez-le ou masquez-le, et réglez sa taille et sa position.", "Le bouton Touch to start : texte (150 caractères maximum), afficher ou masquer le texte, graisse, taille, couleur et position.", "Le message de bienvenue, comme “Welcome to the booth!” : texte, afficher ou masquer, graisse, taille, couleur et position.", "Le message de remerciement, comme “Thanks for visiting!” : texte, afficher ou masquer, graisse, taille, couleur et position.", "Activez Custom Background et choisissez Gradient, Image ou Video. Pour un dégradé, choisissez la couleur de début et de fin.", "Event Overlay : un cadre au-dessus de la caméra ou du fond, qui décore sans couvrir le centre, là où se placent le texte et le logo. Utilisez le Default Border (couleur et épaisseur) ou un PNG personnalisé : portrait 1668 × 2388 px, paysage 2388 × 1668 px, avec le centre transparent.", "Le mouvement du bouton Touch to start : Fade (apparition et disparition en douceur) ou Bounce (rebond ludique de haut en bas). Vérifiez-le dans l'aperçu.", "Nom de l'écran, couleur du cercle de compte à rebours et Session Timeout : après un temps d'inactivité, l'écran d'accueil revient comme économiseur d'écran.", "Étape en plein écran avec un grand anneau animé pendant que la caméra se prépare. Réglez le message (par exemple “Initializing Camera...”), la couleur du texte, la police (System, Serif, Rounded, Mono) et l'ombre du texte.", "Get Ready et compte à rebours sur la vue caméra en direct, puis l'écran d'enregistrement. Réglez le texte Get Ready, sa taille et sa position ; le cercle de compte à rebours (dégradé néon ou couleur unie, taille, couleur du chiffre) ; et le message d'enregistrement, le minuteur et la barre de progression. La durée du compte à rebours se définit dans Motion & Countdown (Off ou 1–10 s).", "Affiché pendant que la vidéo est assemblée et exportée, avec un grand indicateur animé et la progression en direct. Réglez le message, l'indicateur (anneau ou barre, dégradé néon, épaisseur) et le fond.", "L'invité regarde la vidéo terminée et choisit Retake, Continue ou X. L'écran reste affiché jusqu'à ce que l'invité agisse ou que le délai d'inactivité expire (Off, 5–30 s).", "Seuls les canaux activés dans Sharing Settings apparaissent ici, et un X permet aux invités de passer le partage. Réglez le titre, le sous-titre, la couleur du bouton de partage et le délai d'inactivité (Off–60 s). Le délai repart à chaque toucher et affiche un compte à rebours pendant les 5 dernières secondes, puis revient à Touch to start."], "SCREENS": [{"t": "Étape 1 · Détails de l'événement", "s": "Nommez l'événement, définissez ses dates et choisissez sa protection. Seul le titre est obligatoire. Faites défiler l'écran pour le voir en entier.", "hero": "", "tip": "<b>Astuce :</b> Chaque champ avec une icône ? a sa propre aide dans l'app. Touchez Suivant quand vous avez terminé.", "pins": [["Progression de la configuration", "Quatre étapes : Créer un événement, Sélectionner les fonctions, Vérification et Lancer l'événement. L'étape en cours est mise en évidence ; les étapes terminées affichent une coche."], ["Icône d'aide", "Touchez ? à côté d'un champ pour obtenir une courte explication de ce réglage."], ["Titre (obligatoire)", "150 caractères maximum. C'est le nom que vous verrez dans le menu des événements de votre appareil. Le champ reste rouge tant que vous ne l'avez pas rempli."], ["Début", "Date de début de l'événement (jj/mm/aaaa). Touchez l'icône de calendrier pour la choisir."], ["Fin (facultatif)", "Date de clôture de l'événement. Laissez vide si vous ne voulez pas que l'événement se ferme."], ["Description de l'événement", "Notes internes facultatives, 500 caractères maximum : lieu, client, contact, demandes particulières."], ["Contrôle de l'événement · Mode protection", "Demande un code PIN pour quitter l'écran du booth, afin que les invités ne puissent ni quitter l'événement ni modifier ses réglages. Vous ouvrez les options de l'événement avec le petit cadenas en haut à gauche de l'écran du booth. Le mode Demo ou Paid dépend de votre abonnement : sans abonnement actif, l'événement fonctionne en mode Demo et chaque photo et vidéo porte un filigrane de démonstration."]]}, {"t": "Étape 2 · Sélectionner les fonctions", "s": "Chaque carte ouvre un groupe de réglages. Vous pouvez les compléter dans n'importe quel ordre. Faites défiler l'écran pour voir toutes les cartes.", "hero": "", "tip": "<b>Évolution des cartes :</b> Une carte passe du sombre à la couleur, avec une coche, dès que vous enregistrez ses réglages. Vous voyez ainsi d'un coup d'œil ce qu'il reste à faire.<br><br><b>Règle de durée :</b> La durée d'enregistrement est la seule donnée à définir. Les segments la répartissent à parts égales, et Bounce lit le clip terminé en avant puis en arrière : le résultat dure donc deux fois la durée d'enregistrement.<br><br><b>Pas d'internet ?</b> La galerie locale fonctionne toujours sur l'appareil. Le partage en ligne attend dans une file jusqu'au retour de la connexion.", "pins": [["Étape 1 terminée", "La coche indique que les détails de l'événement sont enregistrés. Vous êtes maintenant dans Sélectionner les fonctions."], ["Carte obligatoire (✱)", "Les cartes marquées d'un astérisque doivent être configurées avant de pouvoir prévisualiser et lancer l'événement."], ["Écrans", "Branding des écrans invités : fonds, couleurs, polices et boutons. Affichée en couleur avec une coche car elle est déjà configurée."], ["Mouvement et compte à rebours", "Capteur de démarrage automatique, compte à rebours et voyant d'enregistrement. Le capteur de démarrage automatique utilise les capteurs de mouvement de l'iPhone/iPad placé sur la plateforme ; il ne s'applique donc pas lorsque vous enregistrez avec une GoPro."], ["Source caméra", "Choisissez la caméra de l'appareil ou une GoPro, connectée en Wi-Fi ou en USB, et vérifiez l'aperçu en direct."], ["Orientation et qualité", "Sortie en portrait, paysage ou carré, ainsi que la qualité d'exportation."], ["Vitesse / Rampe", "Partez d'un preset, ou définissez des segments avec leur propre vitesse (0.125x à 8x) et leurs effets. Activez Bounce pour l'effet complet d'aller-retour."], ["Overlays", "Ajoutez un cadre de la bibliothèque, importez le vôtre (PNG, ou MOV/MP4 avec canal alpha pour les overlays animés) ou générez-en un avec l'IA en utilisant des crédits. Ajoutez aussi ici les clips d'intro et d'outro. Si un fichier ne correspond pas à l'emplacement, l'app vous explique pourquoi."], ["Audio", "Importez jusqu'à 5 pistes, lisez-les au hasard ou dans un ordre fixe, et découpez et synchronisez chacune d'elles."], ["Partage", "Activez QR, e-mail et AirDrop. Le SMS est disponible avec le plan Pro aux États-Unis et au Canada."], ["Réglages de la galerie", "Qui peut ouvrir la galerie de l'événement, ce qu'il peut télécharger, et le code PIN qui la protège."], ["Share Station", "Utilisez un deuxième iPad comme borne de partage pendant que l'appareil principal continue d'enregistrer. Fonctionne en réseau local ou en ligne."], ["Collecte de données", "Demandez leurs informations aux invités avant de leur remettre leur vidéo. Les données collectées sont liées à l'événement et peuvent être exportées en CSV depuis le tableau de bord web."], ["Enregistrer le brouillon", "Enregistre votre progression pour terminer la configuration plus tard."], ["Aperçu", "Quand les cartes obligatoires (✱) sont configurées, touchez Preview pour passer à la vérification. Les cartes facultatives, comme Audio, peuvent rester vides ; une carte obligatoire, comme Camera Source, non."]]}, {"t": "2.1 Écrans et branding · Écran d'accueil", "s": "Choisissez ce que voient les invités pendant que le booth attend la prochaine session. Avec Custom Screen, vous choisissez aussi le design à afficher.", "hero": "", "tip": "<b>Astuce :</b> Commencez avec Default Screen pour tester rapidement l'événement, puis passez à Custom Screen pour ajouter le branding du client.", "pins": [["Aide (?)", "Touchez ? pour ouvrir une courte explication en bas de l'écran : “Ce que voient vos invités pendant que le booth est en attente.” Faites glisser le panneau vers le bas pour le fermer."], ["Default Screen", "Utilise l'écran d'accueil intégré à l'app. L'invité touche l'écran pour démarrer la session. Pratique quand vous n'avez pas besoin de branding personnalisé."], ["Custom Screen", "Affiche votre propre design pendant que le booth attend les invités ; toucher l'écran démarre la session. La bordure bleue et la coche indiquent l'option active."], ["Choisissez votre design", "Touchez Select or create a screen pour choisir un design enregistré ou en créer un nouveau."]]}, {"t": "2.1 Écrans et branding · Éditeur d'écran", "s": "Concevez chaque écran de l'expérience invité. L'aperçu du haut se met à jour pendant que vous modifiez. Faites défiler vers le bas dans l'écran et faites glisser la barre d'onglets sur le côté.", "hero": "", "tip": "<b>Astuce :</b> Touchez Save avant de quitter l'éditeur.", "pins": [["Aperçu en direct", "Montre l'aspect qu'aura l'écran d'accueil sur le booth."], ["Onglets de l'éditeur", "Les onglets configurent chaque écran que voient vos invités, de l'écran d'accueil jusqu'au partage."], ["Logo", "Le logo utilisé. Tant que vous n'en importez pas, l'app affiche le logo Selfie Booth (No custom logo). Désactivez Show Logo pour le masquer."], ["Remplacer", "Importez votre propre logo. Un PNG à fond transparent donne les meilleurs résultats."], ["Taille", "Largeur et hauteur du logo, en points."], ["Position", "Position horizontale et verticale, de 0 à 1. Horizontal 0.50 correspond au centre ; une valeur verticale basse place le logo près du haut."], ["Centrer · Réinitialiser · Supprimer", "Centrer place le logo au milieu. Réinitialiser rétablit la taille et la position par défaut. Supprimer retire le logo de l'écran."]]}, {"t": "2.2 Mouvement et compte à rebours", "s": "Définissez comment l'enregistrement démarre et comment les invités savent qu'il est en cours. Touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "", "tip": "<b>Astuce :</b> Avec Auto-Start activé, laissez aussi le compte à rebours, pour que les invités aient le temps de se préparer avant que le bras ne se mette à tourner.", "pins": [["Auto-Start au mouvement", "L'enregistrement démarre tout seul quand l'appareil détecte un mouvement, par exemple quand le bras 360 commence à tourner, sans que personne ne touche l'écran. Le compte à rebours Get Ready reste actif. Il utilise les capteurs de mouvement de l'iPhone/iPad ; il ne s'applique donc pas lorsque vous enregistrez avec une GoPro."], ["Sensibilité", "Apparaît quand Auto-Start est activé. Plus c'est élevé, plus c'est sensible : l'enregistrement démarre avec un mouvement plus léger."], ["Compte à rebours avant l'enregistrement", "Off ou de 1 à 10 secondes. Les invités voient un compte à rebours Get Ready avant le début de l'enregistrement."], ["Voyant d'enregistrement", "Caméra arrière uniquement. Le flash clignote pendant l'enregistrement pour que invités et opérateurs sachent qu'il est actif. C'est différent du Flash constant de Camera Source."]]}, {"id": "cam1", "t": "2.3 Source caméra · iPhone", "s": "Utilisez la caméra de l'iPhone ou de l'iPad pour enregistrer. Cadrez la plateforme dans l'aperçu en direct et affinez l'image avec les contrôles situés en dessous.", "hero": "", "tip": "<b>Astuce :</b> Réglez les contrôles avec l'éclairage réel du lieu, avec quelqu'un sur la plateforme, avant le début de l'événement.", "pins": [["iPhone ou GoPro", "Choisissez la caméra qui enregistre la vidéo 360. Touchez GoPro à l'écran pour voir ses réglages. GoPro est disponible avec le plan Pro.", "Voir les réglages GoPro"], ["Aperçu en direct", "Ce que la caméra voit en ce moment. Utilisez-le pour cadrer la plateforme et les invités."], ["Contrôles de la caméra", "Objectif, exposition, couleur, mise au point, résolution, stabilisation, zoom et flash."], ["Stabilisation supplémentaire", "Stabilise la vidéo pendant le traitement, pas la caméra."]]}, {"id": "cam2", "t": "2.3 Source caméra · GoPro", "s": "Enregistrez avec une GoPro sur le bras. La résolution et le nombre d'images par seconde suivent le plan Speed / Ramp de l'événement, comme avec la caméra de l'iPhone. Ici, vous choisissez l'objectif et la stabilisation.", "hero": "", "tip": "<b>Première utilisation avec une GoPro</b><ol class=\"steps\"><li>Terminez la configuration initiale de la caméra et mettez à jour son firmware avec l'app GoPro Quik. Vous ne le faites qu'une fois.</li><li>Fermez Quik et déconnectez la GoPro de tout autre téléphone ou iPad. Un seul appareil à la fois peut contrôler une GoPro.</li><li>Mettez la GoPro en mode d'appairage. Sur HERO12 et HERO13 : balayez vers le bas, balayez sur le côté et touchez Pair Device. Sur HERO10 et HERO11 : Connections › Connect Device.</li><li>Dans Selfie Booth, choisissez GoPro, sélectionnez votre caméra et touchez Connect.</li><li>Touchez Manage › Test connection avant l'événement.</li></ol>Ensuite, il suffit d'allumer la GoPro. L'app se reconnecte à la prise suivante.", "pins": [["GoPro sélectionnée", "La GoPro enregistre la vidéo. Les invités voient le compte à rebours et un indicateur d'enregistrement, mais il n'y a pas d'aperçu en direct à l'écran. Touchez iPhone pour revenir en arrière.", "Retour à l'iPhone"], ["Caméra appairée", "Le modèle de GoPro et son mode de connexion. Touchez Manage à l'écran pour connecter, tester ou changer la caméra.", "Ouvrir Manage"], ["Champ de vision", "Wide est le plus utilisé pour les booths 360. Linear supprime la courbure fisheye, Narrow recadre plus serré et SuperView est le plus large."], ["HyperSmooth", "La stabilisation propre à la GoPro. Désactivez-la pour obtenir le ralenti le plus net sur un bras qui tourne en douceur."], ["Supprimer les clips de la caméra après le transfert", "Garde la carte SD libre pendant les longs événements. Chaque clip est copié sur cet appareil et vérifié avant d'être supprimé de la GoPro."], ["Format d'enregistrement", "La résolution et le nombre d'images par seconde que la GoPro utilisera, repris de Speed / Ramp."]]}, {"id": "cam3", "t": "2.3 Source caméra · Gérer la GoPro", "s": "S'ouvre depuis Manage. Connectez, testez ou remplacez la caméra. Faites défiler l'écran pour tout voir.", "hero": "", "tip": "<b>Internet pendant l'événement :</b> tant que la GoPro est connectée en Wi-Fi, l'iPad ou l'iPhone est sur le réseau Wi-Fi de la caméra, qui n'a pas d'accès à internet. Le partage et les envois en ligne passent par les données mobiles : utilisez donc un appareil avec forfait de données si vous en avez besoin pendant l'événement.", "pins": [["Caméra et statut", "Modèle, numéro de série, type de connexion et statut (Connecting, Connected). Un seul appareil à la fois peut contrôler une GoPro : désappairez-la d'abord de tout autre iPad."], ["Changement de Wi-Fi", "Juste après la connexion, l'appareil met quelques secondes à changer de réseau et l'app l'attend. Ouvrir l'éditeur d'événement, quitter l'événement ou toucher Disconnect le ramène au Wi-Fi du lieu. La prise suivante reconnecte la caméra."], ["Connecter · Tester la connexion", "Connect associe la caméra. Test connection vérifie qu'elle est prête avant l'arrivée des invités."], ["Appairer une autre GoPro · Oublier la caméra", "Passez à une autre GoPro, ou retirez celle-ci de l'app."], ["Partager le diagnostic", "Envoie les journaux de connexion. Utilisez-le quand le support vous les demande."]]}, {"id": "oq1", "t": "2.4 Orientation et qualité", "s": "Définissez la taille, le nombre d'images par seconde et la qualité d'exportation de la vidéo finale. Touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "", "tip": "", "pins": [["Orientation", "Portrait 1080×1920, paysage 1920×1080, carré 1280×1280 ou 1080×1080, et rectangle 1280×720 ou 720×1280. La taille s'applique à la vidéo finale, aux aperçus, aux overlays et aux modèles, et la note en dessous indique la taille recommandée pour les overlays, l'intro et l'outro."], ["Images par seconde (sortie)", "30 ou 60 fps pour la vidéo finale traitée. Le nombre d'images de capture se règle séparément dans Speed / Ramp ; en Auto, il s'adapte à cette sortie."], ["Qualité", "Le bitrate du fichier exporté : Low 5 Mbps, Medium 8 Mbps, High 12 Mbps, ou Custom pour le définir vous-même. Une qualité supérieure donne une vidéo plus nette, mais un fichier plus lourd, plus long à partager. La taille estimée du fichier apparaît dans Speed / Ramp, sous le résumé des durées."]]}, {"id": "sr1", "t": "2.5 Speed / Ramp · Réglages rapides", "s": "Choisissez le mouvement de la vidéo 360 : ralenti, accéléré et Boomerang. Quick Settings utilise des presets prêts à l'emploi. Faites défiler dans l'écran pour tout voir et touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "", "tip": "", "pins": [["Rapide ou avancé", "Quick Settings utilise des presets, vous n'avez donc pas à construire la rampe à la main. Advanced Settings vous permet de définir vous-même les segments, la durée, la vitesse et plus encore. Touchez Advanced Settings sur l'écran pour le voir.", "Voir Advanced Settings"], ["Choisissez une rampe preset", "Faites glisser les presets sur le côté, ou touchez les flèches jaunes, pour voir les 5. Touchez celui que vous voulez. Chaque carte affiche ses vitesses (tortue = lent, lapin = rapide) et Rec 8s → 16s : durée d'enregistrement → durée de la vidéo finale. ↺ marque les presets avec Boomerang.", "* Pour personnaliser une rampe, allez dans Advanced Settings (PRO)."], ["Durée d'enregistrement · Test Settings", "Durée pendant laquelle la caméra enregistre : la somme de tous les segments du preset. La durée de la vidéo finale se met à jour toute seule. Touchez Test Settings pour essayer une prise avec ces réglages. Pour définir vous-même la durée d'enregistrement, utilisez Advanced Settings."], ["Fréquence de capture", "Laissez sur Auto : l'app choisit la bonne fréquence de capture selon les vitesses et la caméra (par exemple, Auto · 120 fps). Vous pouvez aussi choisir 30, 60, 120 ou 240 fps."], ["Timeline", "Capture est ce que la caméra enregistre ; Output est ce qui est lu avec les vitesses appliquées. Les blocs tortue sont lents, les blocs lapin sont rapides, et chaque bloc affiche sa durée. Dans une vidéo Boomerang, un point de retour jaune marque l'endroit où toute la rampe est relue en sens inverse jusqu'au début."], ["Timing · Taille estimée du fichier", "Timing affiche la durée d'enregistrement (Capture) et la durée de la vidéo finale (Output). Estimated File Size est le débit × la durée de la vidéo finale ÷ 8. Avec la qualité Medium (8 Mbps) et une vidéo de 16 secondes : 8 × 16 ÷ 8 = 16 Mo. L'intro et l'outro s'ajoutent au fichier final."]]}, {"id": "sr2", "t": "2.5 Speed / Ramp · Réglages avancés", "s": "Construisez votre propre rampe segment par segment. Faites défiler dans l'écran pour tout voir et touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "", "tip": "", "pins": [["Advanced Settings", "Les rampes personnalisées sont une fonction Pro. Touchez Quick Settings pour revenir aux presets.", "Retour à Quick Settings"], ["Durée d'enregistrement", "Total recording time définit la durée d'enregistrement de la caméra. Si vous la modifiez, tous les segments sont ajustés proportionnellement pour conserver la forme de la rampe. Touchez Test Settings pour essayer une prise."], ["Fréquence de capture", "Comme dans Quick Settings : laissez sur Auto et l'app choisit la bonne fréquence de capture pour vos vitesses et votre caméra."], ["Bounce (Boomerang)", "Lit la vidéo en avant puis en sens inverse jusqu'au début, un aller-retour complet. Chaque segment est lu en miroir au retour, la vidéo finale dure donc deux fois plus longtemps."], ["Segments", "Chaque bloc est une portion de l'enregistrement avec sa propre durée, sa vitesse, son filtre de couleur et son effet. Faites glisser sur le côté ou touchez les flèches jaunes pour voir les 5 : le segment ouvert s'affiche en grand et les autres en petites cartes. Touchez une carte pour l'ouvrir. Preview lit uniquement ce segment sur son propre écran, avec les mêmes contrôles. Modifier une durée ou une vitesse fait passer le preset en Custom."], ["Durée", "Temps d'enregistrement utilisé par ce segment. La modifier met à jour la durée totale d'enregistrement."], ["Vitesse de lecture", "En dessous de 1x, c'est du ralenti, jusqu'à 0.125x ; au-dessus de 1x, c'est plus rapide, jusqu'à 4x. Elle varie par pas de 0.05x ; maintenez − ou + pour la changer rapidement. Normal correspond au temps réel."], ["Filtre de couleur · Effet avancé", "Filtre de couleur : None, Hue Rotate, RGB Shift, Sepia, Grayscale ou Duotone. Effet avancé : None, Collage 2x2, Rotate, Tunnel ou Tunnel (Frames). Vous pouvez utiliser un de chaque sur le même segment."], ["Ajouter · Supprimer", "Add ajoute un segment de 2 secondes à la fin et allonge la durée d'enregistrement ; Remove en supprime un. 5/10 indique combien de segments vous utilisez, sur un maximum de 10."], ["Timing · Taille estimée du fichier", "Timing affiche la durée d'enregistrement (Capture) et la durée de la vidéo finale (Output). Estimated File Size est le débit × la durée de la vidéo finale ÷ 8. Avec la qualité Medium (8 Mbps) et une vidéo de 16 secondes : 8 × 16 ÷ 8 = 16 Mo. L'intro et l'outro s'ajoutent au fichier final."]]}, {"id": "ov1", "t": "2.6 Overlays", "s": "Ajoutez des cadres et votre branding par-dessus la vidéo. Configurez vos overlays, puis utilisez Preview pour les voir appliqués sur vos réglages Speed / Ramp. Faites défiler dans l'écran pour tout voir.", "hero": "<div class=\"aihero\"><div class=\"aieyebrow\">✦ AI Overlay <span>Pro</span></div><h3>Le cadre de votre événement, conçu par l'IA<svg class=\"spark\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10 3l1.6 4.9L16.5 9.5l-4.9 1.6L10 16l-1.6-4.9L3.5 9.5l4.9-1.6z\"/><path d=\"M18 13l.9 2.6 2.6.9-2.6.9L18 20l-.9-2.6-2.6-.9 2.6-.9z\"/><path d=\"M18.5 2.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z\"/></svg></h3><p>Décrivez l'événement et l'IA conçoit le cadre pour vous. Un mariage or et blanc, un anniversaire néon, un lancement aux couleurs de la marque : saisissez l'idée et en quelques secondes vous obtenez un overlay unique, créé pour cet événement. Le nom, la date et le logo sont ajoutés séparément, ils restent donc toujours nets et exacts.</p><div class=\"aishots\"><figure><img src=\"@aineon\" alt=\"\"><figcaption>“Neon party frame, pink and blue”</figcaption></figure><figure><img src=\"@aigold\" alt=\"\"><figcaption>“Elegant gold wedding frame with leaves”</figcaption></figure></div><div class=\"aifoot\"><span>Exemples illustratifs · Utilise des crédits IA</span><button type=\"button\" class=\"aigo\" data-go=\"ov2\">Voir comment ça marche →</button></div></div>", "tip": "", "pins": [["AI Generate · Upload · Library", "Trois façons d'obtenir votre Image Overlay. Touchez AI Generate sur l'écran pour l'ouvrir."], ["Image Overlay", "Un PNG transparent par-dessus la vidéo, 1080×1920 px recommandé (il suit votre orientation). Choisissez comment l'obtenir dans la rangée ci-dessous."], ["Position", "Main video only place l'overlay uniquement sur la vidéo 360. Full video le place aussi sur l'intro et l'outro."], ["Preview", "Affiche l'overlay appliqué sur votre configuration Speed / Ramp avant l'événement."], ["Animated Overlay", "Même principe que l'Image Overlay, mais animé : une couche vidéo transparente (MOV/MP4 avec canal alpha), 1080×1920 px recommandé. Dans Library, vous trouverez plus de 50 overlays animés prêts à l'emploi, ou utilisez Upload pour importer le vôtre. Il a son propre réglage Position."], ["Intro & Outro", "Courts clips lus avant et après la vidéo principale, en MP4 ou JPG. Pour un JPG, définissez sa durée d'affichage ; un MP4 utilise sa propre durée. Les tailles de l'intro, de l'outro et de l'overlay doivent correspondre. Les vitesses et effets des segments ne s'appliquent jamais à eux."]]}, {"id": "ov2", "t": "2.6 Overlays · Générer avec l'IA", "s": "S'ouvre depuis AI Generate. Décrivez le design, ajoutez des détails facultatifs, puis lancez la génération. Touchez Cancel pour revenir.", "hero": "<div class=\"aihero slim\"><div class=\"aieyebrow\">✦ Idées de prompts</div><p>Touchez-en une pour la copier, collez-la dans Describe Design et adaptez-la. Décrivez le style : thème, couleurs, ambiance. Inutile d'expliquer les tailles ni où se placent les invités ; l'app ajoute ces règles pour vous.</p><div class=\"pchips\"><button type=\"button\" class=\"pchip\">Elegant gold floral frame for a wedding, soft white glow</button><button type=\"button\" class=\"pchip\">Neon 80s party border, pink and blue</button><button type=\"button\" class=\"pchip\">Minimal modern frame with navy corporate accents</button><button type=\"button\" class=\"pchip\">Tropical leaves and sunset colors for a beach party</button><button type=\"button\" class=\"pchip\">Quinceañera frame in rose gold with sparkles</button></div></div>", "tip": "", "pins": [["Taille", "L'IA crée l'overlay avec l'orientation et la taille de votre événement, par exemple Portrait 1080×1920."], ["Describe Design", "Écrivez le style souhaité, par exemple “elegant gold wedding frame with roses”. L'app ajoute automatiquement les règles techniques, vous n'avez donc qu'à décrire le style."], ["Style Reference (facultatif)", "Importez une image et l'IA génère un design plus proche de ce style : l'invitation d'un client, un mood board ou un visuel de marque. Elle est optimisée automatiquement avant l'envoi."], ["Add name & date", "Ajoutez les noms et la date. Ils sont insérés par l'app après la génération du design, le texte est donc toujours exact, sans faute de frappe."], ["Position · Plaque · Police", "Choisissez où placer le texte ; le centre reste libre pour vos invités. Integrated plate : l'IA crée une plaque assortie au cadre et y place le nom et la date. Free placement place le texte seul. Choisissez ensuite une police."], ["Logo / Image (facultatif)", "Ajoutez le logo du client ou une image à l'overlay. PNG ou JPG ; un PNG transparent donne les meilleurs résultats."], ["Generate", "Utilise 3 crédits IA, débités uniquement une fois l'overlay devenu un PNG transparent valide. Votre solde s'affiche en dessous. Si Add name & date est activé, saisissez d'abord un nom ou une date, ou désactivez-le. Votre dernière génération IA est conservée, pour que vous puissiez la comparer à la nouvelle."]]}, {"id": "au1", "t": "2.7 Audio · Aléatoire", "s": "Ajoutez de la musique à la vidéo 360. Importez jusqu'à 5 pistes et choisissez comment elles sont utilisées. Touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "", "tip": "", "pins": [["Random ou Fixed", "Random : une piste est choisie pour chaque capture parmi les morceaux importés, chaque vidéo sonne donc un peu différemment. Touchez Fixed sur l'écran pour utiliser le même morceau à chaque fois.", "Voir Fixed"], ["Add track", "Importez un morceau. Vous pouvez ajouter jusqu'à 5 pistes ; le compteur au-dessus indique combien vous en avez (0/5). Une fois le morceau importé, vous pouvez le couper.", "Voir une piste importée"], ["Position", "Main video only laisse l'intro et l'outro silencieuses. Full video lit la piste en continu, du début de l'intro à la fin de l'outro."]]}, {"id": "au2", "t": "2.7 Audio · Fixe", "s": "Chaque capture utilise le même morceau. Touchez Random sur l'écran pour revenir.", "hero": "", "tip": "", "pins": [["Fixed", "Chaque capture utilise la piste désignée. Après avoir importé des morceaux, touchez le cercle d'une piste pour la désigner."], ["Add track", "Importez un morceau, jusqu'à 5 pistes.", "Voir une piste importée"], ["Position", "Main video only laisse l'intro et l'outro silencieuses. Full video lit la piste en continu, du début de l'intro à la fin de l'outro."]]}, {"id": "au3", "t": "2.7 Audio · Piste importée", "s": "Après avoir ajouté un morceau, vous pouvez le désigner, le couper et l'écouter.", "hero": "", "tip": "", "pins": [["Pistes importées", "1/5 signifie que vous avez un morceau et de la place pour quatre autres."], ["Piste désignée", "Avec Fixed, le cercle plein marque le morceau utilisé par chaque capture. Touchez le cercle d'une autre piste pour la changer."], ["Couper · Preview", "N'utilisez qu'une partie du morceau. Déplacez Start (vert) et End (rouge), ou touchez − et + pour des ajustements précis. Plays indique la partie qui sera utilisée ; touchez Preview pour l'écouter."], ["Remove", "Supprime cette piste de l'événement."], ["Add track", "Ajoutez d'autres morceaux, jusqu'à 5 au total."], ["Position", "Main video only laisse l'intro et l'outro silencieuses. Full video lit la piste en continu, du début de l'intro à la fin de l'outro."]]}, {"id": "sh1", "t": "2.8 Partage", "s": "Choisissez comment les invités reçoivent leur vidéo et personnalisez l'e-mail qu'ils reçoivent. Faites défiler dans l'écran pour tout voir et touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "<div class=\"netnote\"><b>Pas d'internet ? Rien n'est perdu.</b> Les partages par QR, e-mail et SMS sont mis en file d'attente, et l'app les synchronise automatiquement dès que vous êtes reconnecté. AirDrop fonctionne sans internet. Dans certains cas, vous pouvez aussi synchroniser manuellement <a class=\"soonref\" href=\"#eventgallery\">(voir Event Gallery › Sharing Queue)</a>.</div>", "tip": "", "pins": [["QR Code", "Les invités partagent rapidement leurs médias en scannant un QR code."], ["AirDrop", "Les invités partagent avec AirDrop sur iPhone, ou avec Device Sharing sur Android. Fonctionne sans internet."], ["SMS", "Disponible uniquement dans certains pays : si vous ne le voyez pas, il n'est pas disponible dans le vôtre. Il inclut un nombre initial d'envois SMS, et vous pouvez acheter des crédits SMS supplémentaires à tout moment."], ["E-mail", "Les invités envoient leurs photos et vidéos par e-mail instantanément."], ["Include Event Logo", "Ajoute le logo de l'événement à l'e-mail."], ["Header Image", "L'image en haut de l'e-mail. Toute image convient : elle est redimensionnée pour s'adapter à la mise en page de l'e-mail (grand côté de 1200 px) avant l'envoi."], ["Include Event Details", "Ajoute les détails de l'événement, comme le nom et la date, à l'e-mail."], ["Sender name · Reply To", "Sender name est le nom de l'expéditeur affiché pour les e-mails envoyés depuis l'app et le web : utilisez le nom de votre entreprise ou celui de votre client. Reply To est l'adresse e-mail qui reçoit les réponses."], ["Subject · Message", "L'objet et le message de l'e-mail que l'app envoie à l'invité."]]}, {"id": "gal1", "t": "2.9 Réglages de la galerie · Galerie en ligne", "s": "Configurez la galerie en ligne de l'événement : qui peut la voir, ce qu'il peut télécharger et son apparence. Faites défiler dans l'écran pour tout voir et touchez n'importe quel ? dans l'app pour une explication rapide.", "hero": "", "tip": "", "pins": [["Online Gallery · Live Gallery", "Deux onglets : la galerie en ligne que les invités ouvrent depuis un lien, et la Live Gallery (Pro). Touchez Live Gallery sur l'écran pour la voir.", "Voir Live Gallery"], ["Online Gallery", "Lorsqu'elle est désactivée, le lien public vers la galerie complète est restreint. Le lien personnel de chaque invité, partagé par QR, e-mail ou SMS, fonctionne toujours."], ["Gallery Access", "Gallery Link : copiez le lien de la galerie de l'événement et envoyez-le à votre client. Gallery QR : le QR code général de l'événement, pour que chacun puisse ouvrir la galerie complète. Manage Web : ouvre vos galeries en ligne sur le web pour que vous, l'opérateur, puissiez les gérer."], ["Allow Downloads", "Lorsque cette option est désactivée, les visiteurs ne peuvent pas télécharger de médias depuis la galerie publique."], ["Save Original Media", "La vidéo traitée est toujours enregistrée. Lorsque cette option est activée, la capture brute est également conservée dans le dossier Originals de l'événement ; un nouveau traitement ne la modifie ni ne la supprime jamais. Les deux dossiers sont inclus dans l'export de l'événement."], ["Grid Columns", "Nombre de colonnes affichées par la galerie. Auto en affiche 3 sur iPad et ordinateur, et 2 sur téléphone."], ["Gallery Background Color", "Arrière-plan de la galerie de l'événement et de la Share Station. Default utilise le dégradé standard de l'app ; Fuchsia ou Custom le modifient. Les cartes de médias gardent leur propre style."], ["View Gallery in Guest Mode", "Ajoute un raccourci View Gallery en haut à droite de l'écran de démarrage et du sélecteur d'expériences, pour que les invités puissent parcourir la galerie depuis la borne."], ["Gallery PIN", "Plus bas, vous pouvez exiger un code PIN à 6 chiffres pour ouvrir la galerie publique. Les visiteurs doivent le saisir avant de voir le moindre média."]]}, {"id": "lg1", "t": "2.9 Réglages de la galerie · Live Gallery", "s": "Projetez les photos et vidéos de l'événement sous forme de diaporama sur une TV ou un écran externe. Configurez-le ici, puis lancez-le. Touchez Online Gallery sur l'écran pour revenir.", "hero": "", "tip": "", "pins": [["Live Gallery", "Une fonction Pro : un diaporama en direct de l'événement pour une TV ou un écran externe."], ["Launch Live Gallery", "Ouvre le diaporama avec les réglages de cet onglet. Utilisez-le pour projeter la galerie de l'événement sur une TV ou un écran externe. Touchez Live Gallery sur l'écran pour voir comment le connecter.", "Voir comment se connecter"], ["Slide Duration · Transition", "Durée d'affichage de chaque diapositive (3, 5, 8 ou 10 s) et façon dont elle passe à la suivante : Fade, Slide ou Zoom."], ["Video Playback", "Play Full Video affiche chaque vidéo jusqu'à la fin. Limit to Slide Duration la coupe à la durée de la diapositive, pour que le diaporama garde un rythme régulier."], ["Shuffle", "Affiche les médias dans un ordre aléatoire."], ["Continue in Background", "Maintient le diaporama et le serveur actifs lorsque vous quittez l'écran Live Gallery."], ["Background", "La couleur d'arrière-plan du diaporama : Black, Dark Gray, Navy, Green, Maroon, Purple ou une couleur personnalisée."], ["Logo · Event name · QR code", "Affichez le logo et le nom de l'événement sur le diaporama, ainsi qu'un QR code que les invités peuvent scanner pour ouvrir la galerie de l'événement."]]}, {"id": "lg2", "t": "2.9 Live Gallery · Connecter à une TV", "s": "S'ouvre depuis Live Gallery. Connectez l'écran, lancez le diaporama et gardez les contrôles sur l'iPad.", "hero": "", "tip": "", "pins": [["Preview", "Ce que la TV affiche. Le QR code permet aux invités d'ouvrir la galerie de l'événement sur leur téléphone."], ["Événement et éléments", "Le nom de l'événement et le nombre de photos et de vidéos dans le diaporama. Touchez X pour fermer cet écran."], ["Adaptateur HDMI / USB-C", "Branchez un adaptateur : le diaporama s'affiche automatiquement sur la TV pendant que vous gardez les contrôles sur l'iPad."], ["AirPlay", "Faites glisser vers le bas depuis le coin supérieur droit, touchez Screen Mirroring et sélectionnez votre TV, puis touchez Enter Fullscreen."], ["Enter Fullscreen", "Affiche le diaporama en plein écran, pour AirPlay ou pour l'iPad lui-même."], ["Local Network", "Ouvrez le diaporama dans n'importe quel navigateur connecté au même Wi-Fi, par exemple sur une smart TV ou un ordinateur portable."], ["Slideshow & Branding", "La durée, les transitions, le branding et la superposition du QR se règlent dans Gallery Settings › Live Gallery lors de la création ou de la modification de l'événement. Touchez cette carte sur l'écran pour y accéder.", "Aller aux réglages Live Gallery"], ["Play · Minimize · Stop & Exit", "Play lance le diaporama. Minimize masque cet écran pendant que le diaporama continue. Stop & Exit arrête le diaporama et ferme Live Gallery."]]}, {"id": "ss1", "t": "2.10 Share Station", "s": "Utilisez un deuxième appareil comme station où les invités consultent et partagent leurs vidéos, pendant que le booth continue d'enregistrer. Faites défiler dans l'écran pour voir tous les réglages.", "hero": "<div class=\"sshero\"><div class=\"aieyebrow\">Share Station <span>Enterprise</span></div><h3>Deux appareils, un événement</h3><div class=\"devflow\"><div class=\"dev dphone\"><div class=\"scr\"><i class=\"rec\"></i></div><b>Appareil 1</b><small>iPhone ou iPad · Booth</small><em>Enregistre la vidéo 360</em></div><div class=\"flowarrow\"><span>Même compte · Même événement</span><svg viewBox=\"0 0 120 24\" aria-hidden=\"true\"><path d=\"M2 12h110\" stroke-dasharray=\"5 5\"/><path d=\"M104 5l10 7-10 7\"/></svg></div><div class=\"dev dtablet\"><div class=\"ipad\"><span class=\"cam\"></span><div class=\"scr grid\"><i class=\"v1\"></i><i class=\"v2\"></i><i class=\"v3\"></i><i class=\"v4\"></i><i class=\"v5\"></i><i class=\"v6\"></i></div></div><b>Appareil 2</b><small>iPad ou iPhone · Share Station</small><em>Les invités consultent et partagent</em></div></div><div class=\"netnote ssnet\"><b>Les deux appareils ont besoin d'internet.</b> L'appareil 1 et l'appareil 2 doivent être en ligne pour que les vidéos parviennent à la Share Station.</div><div class=\"sshead\">Comment le configurer</div><ol class=\"sssteps\"><li>Sur l'<b>appareil 1</b>, où vous configurez l'événement, activez <b>Enable Share Station</b> et touchez Confirm.</li><li>Sur l'appareil 1, démarrez l'événement. Lorsque la fenêtre apparaît, choisissez <b>Capture Station</b> (cet appareil ne fait qu'enregistrer) ou <b>Everything</b> (il enregistre et les invités peuvent aussi partager ici).</li><li>Sur l'<b>appareil 2</b>, téléchargez Selfie Booth AI et connectez-vous avec les <b>mêmes e-mail et mot de passe</b>.</li><li>Sur l'appareil 2, ouvrez le <b>même événement</b> et choisissez <b>Share Station</b>.</li><li>Si vous avez activé Input PIN, saisissez le code PIN à 6 chiffres.</li><li>L'appareil 2 passe en <b>mode borne</b> et reçoit automatiquement chaque nouvelle photo, vidéo et GIF, pour que les invités puissent les consulter et les partager.</li></ol></div>", "tip": "", "pins": [["Comment fonctionne Share Station", "Touchez ? pour voir le résumé étape par étape affiché ci-dessus."], ["Enable Share Station", "Permet aux invités de partager leurs médias sur une station dédiée, ou directement après la capture."], ["Input PIN", "Un code PIN à 6 chiffres pour la Share Station. Sur l'appareil 2, toucher la flèche de retour en haut à gauche demande le PIN, pour que les invités ne puissent pas quitter la Share Station."], ["Video Columns", "Nombre de colonnes affichées par la grille de la Share Station. Auto en affiche 3 sur iPad et 2 sur téléphone."], ["Capture Station Instructions", "Le message affiché sur l'écran de remerciement lorsque le booth est en mode Capture Station, par exemple “Find your photos at the Share Station near the bar.”"], ["Guest Messages", "Textes affichés sur la Share Station. Welcome : quand un invité s'approche. Empty Gallery : quand il n'y a encore rien à partager. Processing : pendant la préparation des médias ou la connexion à un service de partage. Sharing Success : quand un partage par e-mail, SMS ou AirDrop est terminé. Sharing Error : quand le partage échoue. Laissez un champ vide pour utiliser le texte par défaut de l'app."]]}, {"id": "dc1", "t": "2.11 Collecte de données", "s": "Demandez des informations aux invités avant ou après leur enregistrement, par exemple leur nom, e-mail ou téléphone. Faites défiler dans l'écran pour tout voir.", "hero": "", "tip": "", "pins": [["Enable Data Capture", "Active le questionnaire invité pour cet événement."], ["Survey Timing", "Before Capture : les invités le remplissent avant d'enregistrer. After Capture : après l'enregistrement, avant de recevoir leur vidéo."], ["Survey Fields", "Les questions que vous avez ajoutées, dans l'ordre. Il est vide au départ."], ["Add Field", "Touchez un type pour ajouter une question : Text, Email, Phone, Date, Multiple Choice ou Checkbox."], ["GDPR Consent", "Exige que les invités acceptent un consentement de confidentialité avant de continuer."], ["GDPR Description", "Apparaît uniquement lorsque GDPR Consent est activé. Le texte que voient les invités lorsqu'ils acceptent ; il est prérempli et vous pouvez le modifier (jusqu'à 500 caractères)."]]}, {"id": "rv1", "t": "3 Vérification", "s": "Un récapitulatif de tout ce que vous avez configuré, carte par carte. Vérifiez-le, puis enregistrez. Faites défiler dans l'écran pour tout voir.", "hero": "", "tip": "", "pins": [["Événement et chiffres clés", "Nom, date et lieu de l'événement, plus la durée de la vidéo finale, les options de partage, les pistes audio et la capture de données en un coup d'œil."], ["Une carte par réglage", "Contrôle de l'événement, caméra, vitesse, parcours de l'invité, overlays, audio, capture de données et partage. Pour modifier quelque chose, revenez à Select Features."], ["Enregistrer l'événement", "Enregistre l'événement et vous mène à Launch. Sur un événement en cours de modification, le bouton indique Update Event.", "Aller à Launch"]]}, {"id": "lc1", "t": "4 Lancer l'événement · Vos événements", "s": "Votre événement enregistré apparaît dans Your Events. Démarrez-le d'ici.", "hero": "", "tip": "", "pins": [["Menu ⋮", "Edit, Gallery, Analytics, Duplicate, Close ou Delete l'événement.", "Voir le menu ⋮"], ["Gallery · Métriques", "Un aperçu rapide du nombre de médias et de partages de l'événement."], ["Démarrer l'événement", "Démarre l'événement sur cet appareil. Touchez Start Event à l'écran.", "Démarrer l'événement"]]}, {"id": "lc2", "t": "4 Lancer l'événement · Rôle de l'appareil", "s": "La première fois que vous démarrez un événement sur un appareil, choisissez son rôle. Ensuite, l'événement se charge simplement.", "hero": "", "tip": "", "pins": [["Everything · Capture Station · Share Station", "Everything : cet appareil enregistre et les invités partagent ici. Capture Station : il enregistre uniquement ; les invités partagent sur une Share Station distincte. Share Station : il affiche uniquement la galerie pour que les invités partagent."], ["Démarrer l'événement", "Charge l'événement.", "Continuer"]]}, {"id": "lc3", "t": "4 Lancer l'événement · Prêt", "s": "L'app télécharge les fichiers de l'événement pour fonctionner hors ligne. Touchez Continue pour ouvrir l'écran d'accueil du booth.", "hero": "", "tip": "", "pins": [["Continuer", "Ouvre l'écran d'accueil. Votre booth est en service.", "Voir l'écran d'accueil"]]}, {"id": "eg1", "t": "5 Galerie de l'événement · L'ouvrir", "s": "Vérifiez les envois, récupérez la file d'attente et téléchargez tout depuis la galerie de l'événement. Sur l'écran des événements, touchez le menu ⋮ de l'événement et choisissez Gallery. Pendant l'événement, vous pouvez aussi l'ouvrir avec l'icône de galerie en haut à droite de l'écran d'accueil (voir <a href=\"#quick\">Accès rapides</a>).", "hero": "<div class=\"scenbox\"><div class=\"scenhead\"><b>Situations courantes</b> Touchez-en une pour aller directement au bon écran. Chemin : ⋮ de l'événement › Gallery.</div><div class=\"scengrid\"><button type=\"button\" class=\"scen aigo2\" data-go=\"eg2b\"><b>Un invité revient chercher sa vidéo</b><span>Retrouvez-la dans la galerie et partagez-la à nouveau depuis son menu ⋮.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg7\"><b>Un invité n'a pas reçu son QR ou son e-mail</b><span>Vérifiez le statut de chaque envoi dans Sharing Queue.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg5\"><b>Récupérer ce qui est resté dans la file d'attente</b><span>L'auto-sync s'en charge ; utilisez Sync Now et Retry Failed si vous en avez besoin tout de suite.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg4\"><b>Télécharger la galerie complète de l'événement</b><span>Toutes les photos et vidéos dans un ZIP pour votre client.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg8\"><b>Gérer vos galeries sur le web</b><span>Connectez-vous en tant qu'opérateur depuis n'importe quel ordinateur.</span></button></div></div>", "tip": "", "pins": [["Galerie", "Ouvre la galerie de l'événement : chaque photo et vidéo, son statut de synchronisation et les outils de partage. Touchez Gallery à l'écran.", "Ouvrir la galerie"]]}, {"id": "eg2", "t": "5 Galerie de l'événement · Galerie", "s": "Tous les médias de l'événement, stockés sur cet appareil. Utilisez-la pendant l'événement pour partager à nouveau et vérifier les statuts. Elle fonctionne sans internet ; les fonctions en ligne se mettent à jour dès que vous vous reconnectez.", "hero": "", "tip": "", "pins": [["Menu ⋮", "Sélectionnez des éléments, téléchargez tout l'événement ou ouvrez la Sharing Queue. Touchez ⋮ à l'écran.", "Ouvrir le menu"], ["Statut de synchronisation", "Affiche les envois en cours, par exemple « Syncing 0 of 1 item… ». Il se termine tout seul dès qu'il y a internet."], ["Gallery Link · Gallery QR · Manage Web", "Le lien de la galerie pour le client, le QR général de l'événement et, avec Manage Web, l'accès de l'opérateur aux galeries en ligne. Touchez Manage Web à l'écran.", "Voir Manage Web"], ["Filtres", "All, Photos, Videos, GIFs et plus."], ["Statut de chaque élément", "Un badge bleu Syncing signifie qu'il est encore en cours d'envoi ; une fois envoyé, il indique quand il a été pris (par exemple, 4 days ago). Touchez le ⋮ d'un élément pour le voir, le partager, le télécharger ou le supprimer.", "Voir le menu de l'élément"]]}, {"id": "eg2b", "t": "5 Galerie de l'événement · Un invité revient chercher sa vidéo", "s": "Chaque photo ou vidéo a son propre menu ⋮. Retrouvez la vidéo de l'invité et partagez-la à nouveau directement là.", "hero": "", "tip": "", "pins": [["Échecs · Tout réessayer", "Si quelque chose n'a pas été envoyé, la galerie indique combien ont échoué. Touchez Retry All pour les renvoyer."], ["Élément en erreur", "Une alerte rouge sur une vidéo signifie que son envoi ou son partage a échoué."], ["Voir · Partager · Télécharger · Supprimer", "Touchez le ⋮ d'une vidéo pour la regarder, la partager à nouveau avec l'invité, l'enregistrer sur cet appareil ou la supprimer."]]}, {"id": "eg3", "t": "5 Galerie de l'événement · Menu ⋮", "s": "Les outils de la galerie.", "hero": "", "tip": "", "pins": [["Sélectionner des éléments", "Sélectionnez plusieurs photos ou vidéos pour les partager ou les supprimer ensemble."], ["Télécharger l'événement", "Téléchargez toute la galerie de l'événement. Touchez Download event à l'écran.", "Voir Télécharger l'événement"], ["File d'envois", "Voyez ce qui a été envoyé, ce qui est en attente et ce qui a échoué, et récupérez la file. Touchez Sharing Queue à l'écran.", "Voir Sharing Queue"]]}, {"id": "eg4", "t": "5 Galerie de l'événement · Télécharger l'événement", "s": "Téléchargez tous les fichiers visibles de la galerie dans un ZIP, prêt à remettre à votre client.", "hero": "", "tip": "", "pins": [["Fichiers visibles de la galerie", "Le téléchargement inclut les fichiers actuellement visibles dans la galerie."], ["Informations sur le fichier", "Nom de l'événement, nombre d'éléments et de sessions, ainsi que l'ordre de tri et le filtre qui seront utilisés."], ["Galerie en ligne pendant 30 jours", "La galerie en ligne est disponible pendant 30 jours, puis elle est supprimée. Téléchargez les vidéos avant, depuis le lien de la galerie affiché ici."]]}, {"id": "eg5", "t": "5 Galerie de l'événement · File d'envois", "s": "Share Status : un récapitulatif de ce qui a été envoyé en ligne et partagé, par canal. Touchez les icônes en haut pour voir chaque élément ou chaque envoi.", "hero": "", "tip": "", "pins": [["Share Status · Media Queue · Sharing Queue", "Trois vues : ce récapitulatif, l'envoi en ligne de chaque média et chaque partage (e-mail, SMS, QR). Touchez les icônes à l'écran.", "Voir chaque envoi"], ["Médias", "Vidéos envoyées (Uploaded), en attente (Pending) et en échec (Failed). Rien n'arrive à l'invité tant que sa vidéo n'est pas envoyée en ligne."], ["E-mail · SMS · QR", "Sent, Pending et Failed pour chaque canal. Pour le QR, Ready signifie que le lien de l'invité fonctionne déjà."], ["L'auto-sync est toujours actif", "Les envois se mettent en pause hors ligne et reprennent automatiquement au retour de la connexion. Les boutons ci-dessous agissent sur les mêmes tâches, donc rien n'est jamais dupliqué."], ["Actualiser · Sync Now · Retry Failed", "Refresh met à jour les compteurs. Sync Now envoie immédiatement ce qui est en attente au lieu d'attendre. Retry Failed renvoie uniquement ce qui a échoué."]]}, {"id": "eg6", "t": "5 Galerie de l'événement · File des médias", "s": "Chaque photo ou vidéo et son statut d'envoi.", "hero": "", "tip": "", "pins": [["Filtres", "Par type (All, Video) et par statut : Pending, Uploaded ou Failed. Utilisez Failed pour trouver ce qui n'a pas été envoyé."], ["Statut du fichier", "Uploading, Uploaded ou Failed pour chaque fichier, avec l'heure de capture."]]}, {"id": "eg7", "t": "5 Galerie de l'événement · Chaque envoi", "s": "Chaque partage par e-mail, SMS et QR avec son statut. Commencez ici quand un invité dit qu'il n'a pas reçu sa vidéo.", "hero": "", "tip": "", "pins": [["Filtrer par canal", "All, Email, SMS ou QR."], ["Trouver l'invité", "Cherchez son e-mail ou son numéro de téléphone. Sending signifie que l'envoi est en cours, Sent qu'il a été remis au service d'e-mail ou de SMS, et Failed qu'il faut réessayer."], ["Lien", "Ouvre la vidéo de cet invité en ligne, sur sa propre page, pour que vous puissiez la télécharger."]]}, {"id": "eg8", "t": "5 Galerie de l'événement · Manage Web", "s": "S'ouvre depuis Manage Web : la connexion opérateur sur selfieboothapp.com, pour gérer et télécharger vos galeries d'événements depuis n'importe quel ordinateur.", "hero": "", "tip": "", "pins": [["Connexion de l'opérateur", "Connectez-vous avec l'e-mail et le mot de passe de votre compte Selfie Booth AI. Cet accès est réservé à vous, l'opérateur ; les invités utilisent le lien ou le QR de la galerie."]]}, {"id": "qa1", "t": "6 Accès rapides · Écran d'accueil", "s": "Deux raccourcis sur l'écran d'accueil, pour l'opérateur, pendant le déroulement de l'événement.", "hero": "", "tip": "", "pins": [["Cadenas : Event Options", "Ouvre les options de l'événement : quitter, fermer ou modifier l'événement. Si le mode protection est activé, il demande d'abord le PIN, pour que les invités ne puissent pas y accéder. Touchez le cadenas à l'écran.", "Voir Event Options"], ["Galerie", "Ouvre la galerie de l'événement pour partager à nouveau une vidéo quand un invité revient la chercher. Touchez l'icône de galerie à l'écran.", "Ouvrir la galerie"], ["Tap to Start", "Ce que les invités touchent pour démarrer leur session. Son apparence se règle dans Screens & Branding."]]}, {"id": "qa2", "t": "6 Accès rapides · Options de l'événement", "s": "S'ouvre depuis le cadenas de l'écran d'accueil.", "hero": "", "tip": "", "pins": [["Quitter l'événement", "Quitte l'écran du booth et revient à votre liste d'événements. L'événement reste actif, vous pouvez donc le redémarrer plus tard."], ["Fermer l'événement", "Termine l'événement définitivement : il est marqué Completed et ne peut pas être réactivé. Vous pouvez toujours ouvrir sa galerie, mais plus le redémarrer. Ne le fermez qu'une fois l'événement terminé.", "Voir Fermer l'événement"], ["Modifier l'événement", "Ouvre les réglages de l'événement pour modifier des fonctions sans quitter l'événement."], ["Annuler", "Ferme cette fenêtre et revient à l'écran d'accueil.", "Retour à l'écran d'accueil"]]}, {"id": "qa3", "t": "6 Accès rapides · Menu ⋮ de l'événement", "s": "Dans Your Events, le ⋮ de chaque carte d'événement vous donne des raccourcis pour le gérer sans le démarrer.", "hero": "", "tip": "", "pins": [["Modifier", "Ouvre les réglages de l'événement."], ["Galerie", "Ouvre la galerie de l'événement : statuts, Sharing Queue et téléchargement en ZIP.", "Ouvrir la galerie"], ["Analyses et rapports", "Les chiffres de l'événement : sessions, médias, partages et contacts. Touchez-le à l'écran.", "Voir Analyses et rapports"], ["Dupliquer", "Crée une copie de l'événement avec les mêmes réglages. Pratique pour les clients récurrents ou les événements similaires."], ["Fermer l'événement", "Termine l'événement définitivement : il est marqué Completed et ne peut pas être réactivé.", "Voir Fermer l'événement"], ["Supprimer", "Supprime l'événement."]]}, {"id": "an1", "t": "6 Accès rapides · Analyses et rapports", "s": "Les chiffres de l'événement sur un seul écran. Faites défiler dans l'écran pour tout voir.", "hero": "", "tip": "", "pins": [["Résumé", "Sessions (invités qui ont utilisé le booth), médias totaux, partages et contacts (invités qui ont laissé leurs données)."], ["Partages et livraison", "Combien ont été envoyés par QR, e-mail et SMS, avec le taux de livraison des e-mails."], ["Répartition des médias", "Combien de vidéos, photos ou GIFs l'événement a produits."], ["Collecte de contacts", "Les contacts de Data Capture : total, avec e-mail, avec téléphone et réponses au sondage."], ["Activité par heure", "Sessions et partages par heure, pour repérer les moments de plus forte affluence de l'événement."], ["Contacts récents", "Les derniers contacts collectés."]]}, {"id": "qa4", "t": "6 Accès rapides · Fermer l'événement", "s": "La fermeture demande une confirmation. Cette action est irréversible.", "hero": "<div class=\"netnote\"><b>La fermeture est définitive.</b> Un événement fermé est marqué Completed et ne peut plus être démarré. Sa galerie reste disponible.</div>", "tip": "", "pins": [["Fermer l'événement", "Confirme et ferme l'événement.", "Voir l'événement fermé"], ["Annuler", "Garde l'événement actif.", "Retour à Event Options"]]}, {"id": "qa5", "t": "6 Accès rapides · Événement terminé", "s": "Un événement fermé apparaît comme Completed. Start Event est remplacé par Gallery.", "hero": "", "tip": "", "pins": [["Completed", "L'événement est fermé et ne peut pas être réactivé."], ["Galerie", "La seule action restante : ouvrir sa galerie pour partager, vérifier les statuts ou télécharger.", "Ouvrir la galerie"]]}]};
