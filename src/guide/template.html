<title>Selfie Booth AI Tutorials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: operator manual — phone screenshot with tappable numbered pins on the left, matching callout list on the right; stacks on phones */
:root{
  --bg:#f5f3f7; --surface:#ffffff; --ink:#1d1a24; --muted:#615b6e; --line:#e2dde9;
  --pin:#14b8a6; --pin-ink:#062e2a; --accent:#c2366b; --accent-soft:#fbe7ef;
  --warn:#9a6700; --warn-soft:#fff4d6; --phone:#121016;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1d1a23; --ink:#efecf3; --muted:#a9a2b6; --line:#302b39;
  --pin:#2dd4bf; --pin-ink:#062e2a; --accent:#f06a9b; --accent-soft:#3a1a28;
  --warn:#f2c14e; --warn-soft:#352a10; --phone:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1d1a23; --ink:#efecf3; --muted:#a9a2b6; --line:#302b39;
  --pin:#2dd4bf; --pin-ink:#062e2a; --accent:#f06a9b; --accent-soft:#3a1a28;
  --warn:#f2c14e; --warn-soft:#352a10; --phone:#000; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.sections{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
nav.sections a{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
nav.sections a .k{font-family:var(--display);color:var(--muted);font-size:13px}
nav.sections a[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
nav.sections a.soon{opacity:.55;pointer-events:none}
.plan{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:14px}
.plan b{font-weight:600}
.tiers{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tier{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:6px;padding:1px 7px;color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:36px;align-items:start}
.phonecol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.phone{background:var(--phone);border-radius:38px;padding:10px;box-shadow:0 18px 40px -18px rgba(20,10,30,.45)}
.screen{position:relative;border-radius:29px;overflow:hidden;aspect-ratio:946/2048;max-width:100%}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.canvas{position:relative;container-type:inline-size}
.tabband{position:absolute;left:0;right:0;top:109.5cqw;height:13.1cqw;background:linear-gradient(90deg,rgb(114,56,93),rgb(105,63,102));display:flex;align-items:center}
.tabscroll{display:flex;gap:1.8cqw;overflow-x:auto;scrollbar-width:none;padding-inline:2cqw;width:100%;align-items:center;height:100%}
.tabscroll::-webkit-scrollbar{display:none}
.tabpill{flex:none;height:7.6cqw;padding:0 3.4cqw;border-radius:4cqw;border:0;background:rgba(255,255,255,.1);color:rgba(255,255,255,.78);font:500 3.3cqw/1 var(--body);cursor:pointer;white-space:nowrap}
.band-cam{background:linear-gradient(90deg,rgb(117,79,125),rgb(101,85,135))}
.band-cam .tabhint.r{background:linear-gradient(90deg,rgba(101,85,135,0),rgb(101,85,135) 60%)}
.band-cam .tabhint.l{background:linear-gradient(270deg,rgba(117,79,125,0),rgb(117,79,125) 60%)}
.bandbar{display:none}
.band-cam{flex-direction:column;justify-content:flex-start}
.band-cam .tabscroll{height:13.1cqw;flex:none;padding-inline:12.5cqw}
.band-cam .bandbar{display:block;position:relative;height:1.1cqw;width:calc(100% - 8cqw);margin:0.5cqw auto 0;border-radius:1cqw;background:rgba(255,255,255,.18)}
.band-cam .bandbar span{position:absolute;top:0;bottom:0;border-radius:1cqw;background:#ffd23f;transition:left .15s}
.band-cam .tabhint{height:13.1cqw;bottom:auto;width:12cqw;pointer-events:auto;cursor:pointer;animation:none;background:none}
.band-cam .tabhint i{display:grid;place-items:center;width:8.6cqw;height:8.6cqw;border-radius:50%;background:#ffd23f;color:#3a1440;font:800 7cqw/1 var(--body);font-style:normal;box-shadow:0 0 0 1.2cqw rgba(255,210,63,.28),0 1cqw 3cqw rgba(0,0,0,.35);animation:nudge 1.3s ease-in-out infinite}
.band-cam .tabhint.l i{animation-name:nudgel}
.band-cam .tabhint.dim i{animation:none}
.band-cam .tabhint i{padding-bottom:.6cqw}
@media (prefers-reduced-motion:reduce){.band-cam .tabhint i{animation:none}}
.stripband{position:absolute;z-index:1;background:none!important;display:block!important}
.stripband::before{content:"";position:absolute;left:-4.6cqw;right:-4.4cqw;top:0;bottom:2.2cqw;background:var(--cover,linear-gradient(90deg,rgb(160,76,109),rgb(155,74,113)))}
.stripmoved .pin.instrip{opacity:0;pointer-events:none}
.pin{transition:opacity .2s}
.stripscroll{position:absolute;inset:0 0 2.2cqw 0;overflow-x:auto;scrollbar-width:none}
.stripscroll::-webkit-scrollbar{display:none}
.stripscroll img{display:block;max-width:none}
.stripband .tabhint{background:none!important;top:0;bottom:2.2cqw;height:auto;width:9cqw}
.stripband .tabhint.l{left:-4.5cqw}.stripband .tabhint.r{right:-4.5cqw}
.stripband .bandbar{position:absolute;left:0;right:0;bottom:0.3cqw;margin:0;width:auto}
.fnote{margin-top:6px!important;font-size:13px;color:var(--accent)!important;font-weight:500}
.band-ovl{left:4.6cqw!important;right:4.6cqw!important;background:linear-gradient(90deg,rgb(166,78,103),rgb(161,77,110))!important}
.band-ovl .tabhint.r{background:none}.band-ovl .tabhint.l{background:none}
.band-ovl .tabscroll{padding-inline:11cqw;height:11.4cqw!important}
.band-ovl .tabhint{height:11.4cqw!important}
.aisp{background:linear-gradient(135deg,#ff6fb0,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.probadge{font:700 2.4cqw/1 var(--body);color:#fff;background:linear-gradient(90deg,#ff4fa0,#7c5cff);border-radius:1.4cqw;padding:.8cqw 1.4cqw;margin-left:1cqw;vertical-align:middle}
.tchip .aisp,.tchip .probadge{display:none}
.tcard.ai{border-color:var(--aiedge1);background:var(--aisoft)}
.tcard .tgo{margin-top:10px}
.campill.ai,.band-ovl .campill.gopill{background:linear-gradient(90deg,#2a7bff,#35c3ff);border-color:rgba(255,255,255,.55);color:#fff;font-weight:600}
.campill .wand{width:3.6cqw;height:3.6cqw;vertical-align:-0.7cqw;margin-right:.8cqw;stroke:#fff;fill:none}
.campill .wand .f{fill:#fff;stroke:none}
.tchip.aichip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#2a7bff,#35c3ff);border-color:transparent;color:#fff;font-weight:600}
.tgroup .tchip.aichip.on,.tgroup .tchip.aichip{background:linear-gradient(90deg,#2a7bff,#35c3ff);border-color:transparent;color:#fff}
.tgroup .tchip.aichip.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #2a7bff}
.tchip .wand{width:15px;height:15px;stroke:#fff;fill:none}
.tchip .wand .f{fill:#fff;stroke:none}
.campill.gopill{outline:2px dashed #ffd23f;outline-offset:2px;animation:tapglow 1.6s ease-in-out infinite}
.campill{flex:none;height:9.4cqw;padding:0 3.6cqw;border-radius:5cqw;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font:500 3.3cqw/1 var(--body);cursor:pointer;white-space:nowrap}
.campill.cur{background:rgba(255,255,255,.22);border-color:#fff}
.tabpill.cur{background:#f2507a;color:#fff}
.tabpill.on{box-shadow:0 0 0 2px #fff}
.tabhint{position:absolute;top:0;bottom:0;width:11cqw;display:grid;place-items:center;pointer-events:none;background:linear-gradient(90deg,rgba(105,63,102,0),rgb(105,63,102) 60%);color:#fff;font:700 7cqw/1 var(--body);animation:nudge 1.4s ease-in-out infinite}
.tabhint.r{right:0}
.tabhint.l{left:0;background:linear-gradient(270deg,rgba(114,56,93,0),rgb(114,56,93) 60%);animation-name:nudgel}
@keyframes nudge{50%{transform:translateX(1.2cqw)}}
@keyframes nudgel{50%{transform:translateX(-1.2cqw)}}
@media (prefers-reduced-motion:reduce){.tabhint{animation:none}}
.pin{z-index:2}
ul.subtabs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.tapnote{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px;font-weight:500}
.larr{font-size:22px;line-height:1;color:var(--accent);animation:nudgel2 1.4s ease-in-out infinite}
@keyframes nudgel2{50%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.larr{animation:none}}
.tgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.glabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;width:100%}
.tchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);border-radius:999px;padding:5px 11px;cursor:pointer}
.tchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tcard{margin-top:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.tcard h4{margin:0 0 4px;font-size:15px}
.tcard p{margin:0}
.tcard p.bgn{margin-top:8px;font-size:13px}
ol.callouts ul.subtabs li{display:block;padding:6px 10px;border-radius:8px;border:0;color:var(--muted);font-size:14px;cursor:pointer}
ol.callouts ul.subtabs li span:last-child{display:block}
ul.subtabs li b{color:var(--ink);font-weight:600}
ol.callouts ul.subtabs li.on{background:var(--accent-soft)}

.canvas img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--pin);color:var(--pin-ink);font:700 13px var(--body);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0}
.pin.on{outline:3px solid #fff;outline-offset:2px;animation:pulse 1.2s ease-out 2}
.pin.star{background:rgba(255,255,255,.88);color:#1d1a24;border-color:rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.3);font-size:14px}
.pin.draft{background:var(--warn-soft);color:var(--warn);border-style:dashed;border-color:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,184,166,.7)}100%{box-shadow:0 0 0 16px rgba(20,184,166,0)}}
@media (prefers-reduced-motion:reduce){.pin.on{animation:none}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pager button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);border-radius:10px;padding:8px 14px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
.panel{min-width:0}
.panel h2{font-family:var(--display);font-size:26px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.panel .sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
ol.callouts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.callouts li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:12px;border:1px solid transparent;cursor:pointer}
ol.callouts li:hover{background:var(--surface)}
ol.callouts li.on{background:var(--surface);border-color:var(--line)}
ol.callouts .n{width:28px;height:28px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font:700 13px var(--body);display:grid;place-items:center}
ol.callouts li.star .n{background:var(--surface);color:var(--ink);border:1px solid var(--muted);font-size:14px}
ol.callouts li.draft .n{background:var(--warn-soft);color:var(--warn);border:2px dashed var(--warn)}
ol.callouts h3{margin:2px 0 2px;font-size:15px;font-weight:600}
ol.callouts p{margin:0;color:var(--muted);max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.chip.t{color:var(--accent);border:1px solid var(--accent)}
.chip.d{color:var(--warn);background:var(--warn-soft)}
.tap{position:absolute;z-index:1;border:2px dashed #ffd23f;border-radius:3cqw;background:rgba(255,210,63,.12);cursor:pointer;padding:0;animation:tapglow 1.6s ease-in-out infinite}
.tap:hover,.tap:focus-visible{background:rgba(255,210,63,.28)}
@keyframes tapglow{50%{box-shadow:0 0 0 1.4cqw rgba(255,210,63,.25)}}
@media (prefers-reduced-motion:reduce){.tap{animation:none}}
button.more{border:0;background:none;padding:0;cursor:pointer;font-family:var(--body)}
a.more,button.more{display:inline-block;margin-top:6px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
a.more:hover{text-decoration:underline}
.tip{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:14px;max-width:66ch}
.tip ol.steps{margin:6px 0 8px;padding-left:20px;display:grid;gap:4px}
.tip b{color:var(--ink)}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);gap:22px}
  .phonecol{position:static;max-width:300px;margin:0 auto;width:100%}
}

/* AI spotlight */
:root{--ai1:#c2366b;--ai2:#7c4dff;--aisoft:#dcebff;--aiedge1:#2f86ff;--aiedge2:#8b6cff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ai1:#f06a9b;--ai2:#a98bff;--aisoft:#172b4d;--aiedge1:#4f9dff;--aiedge2:#a98bff}}
:root[data-theme="dark"]{--ai1:#f06a9b;--ai2:#a98bff;--aisoft:#172b4d;--aiedge1:#4f9dff;--aiedge2:#a98bff}
.pin.ai{background:linear-gradient(135deg,#ff5fa2,#8b5cff);color:#fff;border-color:#fff;box-shadow:0 0 0 3px rgba(139,92,255,.35),0 2px 10px rgba(0,0,0,.35)}
ol.callouts li.ai .n{background:linear-gradient(135deg,var(--ai1),var(--ai2));color:#fff}
.aihero{position:relative;margin:0 0 20px;padding:18px 18px 16px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--aisoft) 70%,#ffffff 30%),var(--aisoft)) padding-box,linear-gradient(135deg,var(--aiedge1),var(--aiedge2)) border-box;border:1.5px solid transparent}
.aihero h3 .spark{display:inline-block;width:1.35em;height:1.35em;margin-left:5px;vertical-align:-0.25em;fill:url(#sparkgrad);fill:var(--ai2)}
.aihero h3 .spark path:first-child{fill:var(--ai1)}
.aihero.slim{padding:14px 16px}
.aieyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:linear-gradient(90deg,var(--ai1),var(--ai2));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.aieyebrow span{-webkit-text-fill-color:#fff;color:#fff;background:linear-gradient(90deg,var(--ai1),var(--ai2));border-radius:5px;padding:1px 6px;font-size:10px;letter-spacing:.06em}
.aihero h3{font-family:var(--display);font-size:22px;line-height:1.2;margin:6px 0 6px;text-wrap:balance}
.aihero p{margin:0;color:var(--muted);max-width:62ch}
.aishots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;max-width:340px}
.aishots figure{margin:0;min-width:0}
.aishots img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;box-shadow:0 8px 20px -10px rgba(40,10,60,.5)}
.aishots figcaption{font-size:12.5px;color:var(--ink);margin-top:6px;font-style:italic}
.aifoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--muted)}
.aigo{border:0;cursor:pointer;font:600 14px var(--body);color:#fff;background:linear-gradient(90deg,var(--ai1),var(--ai2));border-radius:999px;padding:8px 14px}
.aigo:focus-visible,.pchip:focus-visible{outline:2px solid var(--ai2);outline-offset:2px}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.pchip:hover{border-color:var(--ai2)}
.pchip.copied{border-color:var(--ai1);background:var(--accent-soft)}
.pchip.copied::after{content:" ✓";color:var(--ai1);font-weight:700}
.netnote{margin:0 0 18px;padding:13px 16px;border-radius:12px;background:linear-gradient(120deg,#c2385f,#a13a7e 55%,#7b3d9e);border:0;border-left:4px solid #4f9dff;color:#fde9f2;font-size:14px;max-width:66ch;box-shadow:0 8px 20px -12px rgba(120,30,90,.6)}
.netnote b{color:#fff}
.soonref{color:#ffd6e8;font-style:italic;text-decoration:underline dotted}
.scenbox{margin:0 0 20px;padding:14px;border-radius:14px;background:linear-gradient(120deg,#c2385f,#a13a7e 55%,#7b3d9e);color:#fde9f2}
.scenhead{font-size:14px;margin-bottom:10px}.scenhead b{color:#fff;font-size:15px;margin-right:4px}
.scengrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.scengrid{grid-template-columns:minmax(0,1fr)}}
.scen{text-align:left;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font:400 13px var(--body);display:grid;gap:3px}
.scen b{font-size:14px;font-weight:600}.scen span{color:#fde9f2}
.scen:hover,.scen:focus-visible{background:rgba(255,255,255,.22);outline:none}
a.soonref{color:#fff;text-decoration:underline}
.sshero{margin:0 0 20px;padding:18px;border-radius:16px;background:linear-gradient(var(--aisoft),var(--aisoft)) padding-box,linear-gradient(135deg,#c2385f,#7b3d9e) border-box;border:1.5px solid transparent}
.sshero h3{font-family:var(--display);font-size:22px;margin:6px 0 14px}
.devflow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);align-items:center;gap:10px}
.dev{display:grid;justify-items:center;text-align:center;gap:3px;min-width:0}
.dev .scr{border:3px solid var(--ink);background:linear-gradient(160deg,#c2385f,#7b3d9e);display:grid;place-items:center;margin-bottom:6px}
.dev.dphone .scr{width:46px;height:88px;border-radius:12px}
.dev.dtablet .scr{width:118px;height:86px;border-radius:12px;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px}
.dev .scr i{display:block;background:rgba(255,255,255,.75);border-radius:3px;width:100%;height:100%}
.dev .scr i.rec{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.dev b{font-size:14px}.dev small{color:var(--muted);font-size:12px}.dev em{font-style:normal;font-size:12.5px;color:var(--accent);font-weight:600}
.flowarrow{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);text-align:center;max-width:120px}

.dev.dtablet .ipad{position:relative;width:150px;height:112px;border-radius:16px;background:#1d1a24;padding:9px 12px;box-shadow:0 8px 18px -10px rgba(0,0,0,.5);margin-bottom:6px}
.dev.dtablet .ipad .cam{position:absolute;top:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#5b5866}
.dev.dtablet .ipad .scr{width:100%;height:100%;margin:0;border:0;border-radius:6px;background:#2a1530;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px}
.dev.dtablet .scr i{position:relative;border-radius:3px}
.dev.dtablet .scr i::after{content:"";position:absolute;left:50%;top:50%;margin:-4px 0 0 -2px;border-left:6px solid rgba(255,255,255,.9);border-top:4px solid transparent;border-bottom:4px solid transparent}
.dev.dtablet .scr i.v1{background:linear-gradient(135deg,#ff6fa5,#7b3d9e)}.dev.dtablet .scr i.v2{background:linear-gradient(135deg,#3aa0ff,#6a3cc9)}
.dev.dtablet .scr i.v3{background:linear-gradient(135deg,#ffb15c,#d23d6a)}.dev.dtablet .scr i.v4{background:linear-gradient(135deg,#35c3a0,#2a6fd1)}
.dev.dtablet .scr i.v5{background:linear-gradient(135deg,#c86bff,#ff5f8a)}.dev.dtablet .scr i.v6{background:linear-gradient(135deg,#ffd23f,#e0507a)}
.ssnet{margin:16px 0 0}
.sshead{font-weight:600;margin:16px 0 6px}
.sssteps{margin:0;padding-left:22px;display:grid;gap:6px;color:var(--muted);max-width:64ch}

   {x:96,y:18.8,tier:"GoPro · Pro",go:"cam2",en:["iPhone or GoPro","Choose which camera records the 360 video. Tap GoPro on the screen to see its settings. GoPro is available on the Pro plan.","See GoPro settings"],es:["iPhone o GoPro","Elige qué cámara graba el video 360. Toca GoPro en la pantalla para ver su configuración. GoPro está disponible en el plan Pro.","Ver configuración de GoPro"]},
   {x:79,y:31,en:["Live view","What the camera sees right now. Use it to frame the platform and the guests."],es:["Vista en vivo","Lo que la cámara ve en este momento. Úsala para encuadrar la plataforma y a los invitados."]},
   {x:12,yc:134,bandPin:true,en:["Camera controls","Lens, exposure, color, focus, resolution, stabilization, zoom and flash."],es:["Controles de cámara","Lente, exposición, color, enfoque, resolución, estabilización, zoom y flash."]},
   {x:61,y:81.2,en:["Extra stabilization","Stabilizes the video during processing, not the camera."],es:["Estabilización extra","Estabiliza el video durante el procesamiento, no la cámara."]}
  ]},
 {id:"cam2",img:"cam2",taps:[{x:4.2,y:16.4,w:44.5,h:4.7,go:"cam1"},{x:65.7,y:29.4,w:25,h:5,go:"cam3"}],
  en:{t:"2.3 Camera Source · GoPro",s:"Record with a GoPro on the arm. Resolution and frame rate follow the event's Speed / Ramp plan, just like the iPhone camera. Here you pick the lens and stabilization.",tip:"<b>First time with a GoPro</b><ol class=\"steps\"><li>Finish the camera's first setup and update its firmware with the GoPro Quik app. You only do this once.</li><li>Close Quik and disconnect the GoPro from any other phone or iPad. Only one device can control a GoPro at a time.</li><li>Put the GoPro in pairing mode. On HERO12 and HERO13: swipe down, slide to the side and tap Pair Device. On HERO10 and HERO11: Connections › Connect Device.</li><li>In Selfie Booth, choose GoPro, select your camera and tap Connect.</li><li>Tap Manage › Test connection before the event.</li></ol>After that, just turn the GoPro on. The app reconnects on the next take."},
  es:{t:"2.3 Fuente de cámara · GoPro",s:"Graba con una GoPro en el brazo. La resolución y los cuadros por segundo siguen el plan de Speed / Ramp del evento, igual que con la cámara del iPhone. Aquí eliges el lente y la estabilización.",tip:"<b>La primera vez con una GoPro</b><ol class=\"steps\"><li>Termina la configuración inicial de la cámara y actualiza su firmware con la app GoPro Quik. Esto se hace una sola vez.</li><li>Cierra Quik y desconecta la GoPro de cualquier otro teléfono o iPad. Solo un dispositivo puede controlar la GoPro a la vez.</li><li>Pon la GoPro en modo de emparejamiento. En HERO12 y HERO13: desliza hacia abajo, desliza hacia un lado y toca Pair Device. En HERO10 y HERO11: Connections › Connect Device.</li><li>En Selfie Booth, elige GoPro, selecciona tu cámara y toca Connect.</li><li>Toca Manage › Test connection antes del evento.</li></ol>Después de eso, solo enciende la GoPro. La app se reconecta en la siguiente toma."},
  pins:[
   {x:96,y:18.8,tier:"Pro",go:"cam1",en:["GoPro selected","The GoPro records the video. Guests see the countdown and a recording indicator, but there's no live preview on screen. Tap iPhone to go back.","Back to iPhone"],es:["GoPro seleccionada","La GoPro graba el video. Los invitados ven la cuenta regresiva y un indicador de grabación, pero no hay vista en vivo en la pantalla. Toca iPhone para regresar.","Regresar a iPhone"]},
   {x:61,y:31.7,go:"cam3",en:["Paired camera","The GoPro model and how it's connected. Tap Manage on the screen to connect, test or change the camera.","Open Manage"],es:["Cámara emparejada","El modelo de GoPro y cómo está conectada. Toca Manage en la pantalla para conectar, probar o cambiar la cámara.","Abrir Manage"]},
   {x:34,y:45.6,en:["Field of view","Wide is the most used for 360 booths. Linear removes the fisheye curve, Narrow crops in closer and SuperView is the widest."],es:["Campo de visión","Wide es el más usado en booths 360. Linear quita la curva de ojo de pez, Narrow recorta más cerrado y SuperView es el más amplio."]},
   {x:66,y:62,en:["HyperSmooth","The GoPro's own stabilization. Turn it off for the crispest slow motion on a smooth arm."],es:["HyperSmooth","La estabilización de la propia GoPro. Apágala para el slow motion más nítido en un brazo que gira suave."]},
   {x:62.5,y:73.5,en:["Delete clips from camera after transfer","Keeps the SD card clean during long events. Each clip is copied to this device and checked before it's deleted from the GoPro."],es:["Borrar clips de la cámara después de transferir","Mantiene libre la tarjeta SD en eventos largos. Cada clip se copia a este dispositivo y se verifica antes de borrarlo de la GoPro."]},
   {x:82,y:78.2,en:["Recording format","The resolution and frame rate the GoPro will use, taken from Speed / Ramp."],es:["Formato de grabación","La resolución y los cuadros por segundo que usará la GoPro, tomados de Speed / Ramp."]}
  ]},
 {id:"cam3",img:"cam3",tall:true,taps:[{x:3.5,y:6,w:17,h:5.2,go:"cam2"}],
  en:{t:"2.3 Camera Source · Manage GoPro",s:"Opens from Manage. Connect, test or replace the camera. Scroll inside the screen to see everything.",tip:"<b>Internet during the event:</b> while the GoPro is connected by Wi-Fi, the iPad or iPhone is on the camera's own Wi-Fi, which has no internet. Online sharing and uploads go over mobile data, so use a device with a data plan if you need them during the event."},
  es:{t:"2.3 Fuente de cámara · Administrar GoPro",s:"Se abre desde Manage. Conecta, prueba o cambia la cámara. Desliza dentro de la pantalla para ver todo.",tip:"<b>Internet durante el evento:</b> mientras la GoPro está conectada por Wi-Fi, el iPad o iPhone está en la red Wi-Fi de la cámara, que no tiene internet. Lo que se comparte y se sube en línea usa datos móviles, así que usa un dispositivo con plan de datos si los necesitas durante el evento."},
  pins:[
   {x:78,y:19.2,en:["Camera and status","Model, serial number, connection type and status (Connecting, Connected). Only one device can control a GoPro at a time: unpair it from any other iPad first."],es:["Cámara y estado","Modelo, número de serie, tipo de conexión y estado (Connecting, Connected). Solo un dispositivo puede controlar la GoPro a la vez: primero desempárejala de cualquier otro iPad."]},
   {x:4,y:30.5,en:["Wi-Fi switch","Right after connecting, the device takes a few seconds to switch networks and the app waits for it. Opening the event editor, leaving the event or tapping Disconnect returns it to the venue Wi-Fi. The next take reconnects the camera."],es:["Cambio de Wi-Fi","Justo después de conectar, el dispositivo tarda unos segundos en cambiar de red y la app lo espera. Al abrir el editor del evento, salir del evento o tocar Disconnect, regresa al Wi-Fi del lugar. La siguiente toma vuelve a conectar la cámara."]},
   {x:93,y:49,en:["Connect · Test connection","Connect links the camera. Test connection checks it's ready before guests arrive."],es:["Conectar · Probar conexión","Connect enlaza la cámara. Test connection revisa que esté lista antes de que lleguen los invitados."]},
   {x:93,y:61,en:["Pair a different GoPro · Forget camera","Switch to another GoPro, or remove this one from the app."],es:["Emparejar otra GoPro · Olvidar cámara","Cambia a otra GoPro o quita esta de la app."]},
   {x:93,y:70.2,en:["Share diagnostics","Sends connection logs. Use it when support asks for them."],es:["Compartir diagnóstico","Envía los registros de conexión. Úsalo cuando soporte te los pida."]}
  ]},
 {id:"oq1",img:"oq1",
  en:{t:"2.4 Orientation & Quality",s:"Set the size, frame rate and export quality of the final video. Tap any ? in the app for a quick explanation.",tip:""},
  es:{t:"2.4 Orientación y calidad",s:"Define el tamaño, los cuadros por segundo y la calidad de exportación del video final. Toca cualquier ? en la app para ver una explicación rápida.",tip:""},
  pins:[
   {x:53,y:22,en:["Orientation","Portrait 1080×1920, Landscape 1920×1080, Square 1280×1280 or 1080×1080, and Rectangle 1280×720 or 720×1280. The size applies to the final video, previews, overlays and templates, and the note below shows the recommended overlay and intro/outro size."],es:["Orientación","Vertical 1080×1920, horizontal 1920×1080, cuadrado 1280×1280 o 1080×1080, y rectángulo 1280×720 o 720×1280. El tamaño se aplica al video final, las vistas previas, los overlays y las plantillas, y la nota de abajo indica el tamaño recomendado para overlays, intro y outro."]},
   {x:63,y:50.3,en:["Frame Rate (Output)","30 or 60 fps for the final processed video. The capture frame rate is set separately in Speed / Ramp; on Auto it adjusts to match this output."],es:["Cuadros por segundo (salida)","30 o 60 fps para el video final procesado. Los cuadros de captura se configuran aparte en Speed / Ramp; en Auto se ajustan a esta salida."]},
   {x:36.5,y:69.9,en:["Quality","The bitrate of the exported file: Low 5 Mbps, Medium 8 Mbps, High 12 Mbps, or Custom to set your own. Higher quality gives a sharper video but a bigger file that takes longer to share. The estimated file size appears in Speed / Ramp, under the timing summary."],es:["Calidad","El bitrate del archivo exportado: Low 5 Mbps, Medium 8 Mbps, High 12 Mbps, o Custom para definirlo tú. Más calidad da un video más nítido, pero un archivo más pesado que tarda más en compartirse. El tamaño estimado del archivo aparece en Speed / Ramp, debajo del resumen de tiempos."]}
  ]},
 {id:"sr1",img:"sr1",tall:true,taps:[{x:50,y:12.35,w:45.5,h:2.77,go:"sr2"}],strip:{src:"srstrip",top:63.4,h:32.2,left:8.88,width:82.45,ratio:8.193},
  en:{t:"2.5 Speed / Ramp · Quick Settings",s:"Pick how the 360 video moves: slow motion, fast motion and Boomerang. Quick Settings uses ready-made presets. Scroll inside the screen to see everything, and tap any ? in the app for a quick explanation.",tip:""},
  es:{t:"2.5 Speed / Ramp · Ajustes rápidos",s:"Elige cómo se mueve el video 360: cámara lenta, rápida y Boomerang. Quick Settings usa presets ya armados. Desliza dentro de la pantalla para ver todo y toca cualquier ? en la app para ver una explicación rápida.",tip:""},
  pins:[
   {x:47,y:13.70,tier:"Advanced · Pro",go:"sr2",en:["Quick or Advanced","Quick Settings uses presets, so you don't have to build the ramp by hand. Advanced Settings lets you set segments, timing, speed and more yourself. Tap Advanced Settings on the screen to see it.","See Advanced Settings"],es:["Rápido o avanzado","Quick Settings usa presets, para que no tengas que armar la rampa a mano. Advanced Settings te deja definir tú los segmentos, tiempos, velocidades y más. Toca Advanced Settings en la pantalla para verlo.","Ver Advanced Settings"]},
   {x:37.5,y:19.40,note:true,en:["Choose a preset ramp","Swipe the presets sideways, or tap the yellow arrows, to see all 5. Tap the one you want. Each card shows its speeds (turtle = slow, rabbit = fast) and Rec 8s → 16s: recording time → final video time. ↺ marks presets with Boomerang.","* To customize a ramp, go to Advanced Settings (PRO)."],es:["Elige una rampa preset","Desliza los presets hacia los lados, o toca las flechas amarillas, para ver los 5. Toca el que quieras. Cada tarjeta muestra sus velocidades (tortuga = lento, conejo = rápido) y Rec 8s → 16s: tiempo de grabación → duración del video final. ↺ marca los presets con Boomerang.","* Si quieres personalizar la rampa, ve a Advanced Settings (PRO)."]},
   {x:53.5,y:34.92,en:["Recording time · Test Settings","How long the camera records: the sum of all the segments of the preset. The final video time updates by itself. Tap Test Settings to try a take with these settings. To set the recording time yourself, use Advanced Settings."],es:["Tiempo de grabación · Probar ajustes","Cuánto graba la cámara: la suma de todos los segmentos del preset. La duración del video final se actualiza sola. Toca Test Settings para probar una toma con estos ajustes. Para definir tú el tiempo de grabación, usa Advanced Settings."]},
   {x:64.5,y:45.46,en:["Capture Frame Rate","Leave it on Auto: the app picks the right capture rate for the speeds and the camera (for example, Auto · 120 fps). You can also set 30, 60, 120 or 240 fps."],es:["Cuadros de captura","Déjalo en Auto: la app elige los cuadros por segundo correctos para las velocidades y la cámara (por ejemplo, Auto · 120 fps). También puedes elegir 30, 60, 120 o 240 fps."]},
   {x:40.5,y:61.53,en:["Timeline","Capture is what the camera records; Output is what plays back with the speeds applied. Turtle blocks are slow, rabbit blocks are fast, and each block shows its duration. In a Boomerang video, a yellow return point marks where the whole ramp plays back in reverse to the start."],es:["Línea de tiempo","Capture es lo que graba la cámara; Output es lo que se reproduce con las velocidades aplicadas. Los bloques con tortuga son lentos, los de conejo rápidos, y cada bloque muestra su duración. En un video con Boomerang, un punto amarillo de regreso marca dónde toda la rampa se reproduce en reversa hasta el inicio."]},
   {x:37,y:82.38,en:["Timing · Estimated file size","Timing shows the recording time (Capture) and the final video time (Output). Estimated File Size is bitrate × final video time ÷ 8. With Medium quality (8 Mbps) and a 16-second video: 8 × 16 ÷ 8 = 16 MB. Intro and outro add to the final file."],es:["Tiempos · Tamaño estimado del archivo","Timing muestra el tiempo de grabación (Capture) y la duración del video final (Output). Estimated File Size es bitrate × duración del video final ÷ 8. Con calidad Medium (8 Mbps) y un video de 16 segundos: 8 × 16 ÷ 8 = 16 MB. El intro y el outro se suman al archivo final."]}
  ]},
 {id:"sr2",img:"sr2",tall:true,strip:{src:"segstrip",top:198.24,h:91.34,left:8.53,width:82.95,ratio:2.271,cover:"linear-gradient(180deg,rgb(101,102,160),rgb(118,92,150) 50%,rgb(122,97,142))"},taps:[{x:4.3,y:8.74,w:45,h:2.46,go:"sr1"}],
  en:{t:"2.5 Speed / Ramp · Advanced Settings",s:"Build your own ramp segment by segment. Scroll inside the screen to see everything, and tap any ? in the app for a quick explanation.",tip:""},
  es:{t:"2.5 Speed / Ramp · Ajustes avanzados",s:"Arma tu propia rampa segmento por segmento. Desliza dentro de la pantalla para ver todo y toca cualquier ? en la app para ver una explicación rápida.",tip:""},
  pins:[
   {x:50,y:9.94,tier:"Pro",go:"sr1",en:["Advanced Settings","Custom ramps are a Pro feature. Tap Quick Settings to go back to the presets.","Back to Quick Settings"],es:["Ajustes avanzados","Las rampas personalizadas son una función Pro. Toca Quick Settings para regresar a los presets.","Regresar a Quick Settings"]},
   {x:53,y:13.99,en:["Recording time","Total recording time sets how long the camera records. If you change it, every segment scales proportionally to keep the shape of the ramp. Tap Test Settings to try a take."],es:["Tiempo de grabación","Total recording time define cuánto graba la cámara. Si lo cambias, todos los segmentos se ajustan en proporción para conservar la forma de la rampa. Toca Test Settings para probar una toma."]},
   {x:62.5,y:26.15,en:["Capture Frame Rate","Same as in Quick Settings: leave it on Auto and the app picks the right capture rate for your speeds and camera."],es:["Cuadros de captura","Igual que en Quick Settings: déjalo en Auto y la app elige los cuadros correctos para tus velocidades y tu cámara."]},
   {x:65.5,y:37.75,en:["Bounce (Boomerang)","Plays the video forward and then in reverse back to the start, a full spin-and-return. Each segment plays mirrored on the return, so the final video lasts twice as long."],es:["Bounce (Boomerang)","Reproduce el video hacia adelante y luego en reversa hasta el inicio, una vuelta completa de ida y regreso. Cada segmento se repite en espejo al regresar, así que el video final dura el doble."]},
   {x:42.5,y:46.17,en:["Segments","Each block is a slice of the recording with its own duration, speed, color filter and effect. Swipe sideways or tap the yellow arrows to see all 5: the open segment is shown large and the others as small cards. Tap a card to open it. Preview plays just that segment on its own screen, with the same controls. Changing a duration or speed switches the preset to Custom."],es:["Segmentos","Cada bloque es una parte de la grabación con su propia duración, velocidad, filtro de color y efecto. Desliza hacia los lados o toca las flechas amarillas para ver los 5: el segmento abierto se ve grande y los demás como tarjetas chicas. Toca una tarjeta para abrirla. Preview reproduce solo ese segmento en su propia pantalla, con los mismos controles. Al cambiar una duración o velocidad, el preset pasa a Custom."]},
   {x:40,y:51.42,instrip:true,en:["Duration","How much recording time this segment uses. Changing it updates the total recording time."],es:["Duración","Cuánto tiempo de grabación usa este segmento. Al cambiarla se actualiza el tiempo total de grabación."]},
   {x:54,y:55.87,instrip:true,en:["Playback Speed","Below 1x is slow motion, down to 0.125x; above 1x is faster, up to 4x. It moves in steps of 0.05x; hold − or + to change it quickly. Normal is real time."],es:["Velocidad de reproducción","Debajo de 1x es cámara lenta, hasta 0.125x; arriba de 1x es más rápido, hasta 4x. Cambia en pasos de 0.05x; mantén presionado − o + para moverla rápido. Normal es tiempo real."]},
   {x:38,y:62.31,instrip:true,en:["Color Filter · Advanced Effect","Color Filter: None, Hue Rotate, RGB Shift, Sepia, Grayscale or Duotone. Advanced Effect: None, Collage 2x2, Rotate, Tunnel or Tunnel (Frames). You can use one of each on the same segment."],es:["Filtro de color · Efecto avanzado","Filtro de color: None, Hue Rotate, RGB Shift, Sepia, Grayscale o Duotone. Efecto avanzado: None, Collage 2x2, Rotate, Tunnel o Tunnel (Frames). Puedes usar uno de cada uno en el mismo segmento."]},
   {x:96,y:72.16,en:["Add · Remove","Add appends a 2-second segment and extends the recording time; Remove deletes one. 5/10 shows how many segments you're using, out of a maximum of 10."],es:["Agregar · Quitar","Add agrega un segmento de 2 segundos al final y alarga el tiempo de grabación; Remove borra uno. 5/10 indica cuántos segmentos usas, de un máximo de 10."]},
   {x:37,y:87.23,en:["Timing · Estimated file size","Timing shows the recording time (Capture) and the final video time (Output). Estimated File Size is bitrate × final video time ÷ 8. With Medium quality (8 Mbps) and a 16-second video: 8 × 16 ÷ 8 = 16 MB. Intro and outro add to the final file."],es:["Tiempos · Tamaño estimado del archivo","Timing muestra el tiempo de grabación (Capture) y la duración del video final (Output). Estimated File Size es bitrate × duración del video final ÷ 8. Con calidad Medium (8 Mbps) y un video de 16 segundos: 8 × 16 ÷ 8 = 16 MB. El intro y el outro se suman al archivo final."]}
  ]},
 {id:"ov1",img:"ov1",tall:true,band:"ovl",
  en:{t:"2.6 Overlays",s:"Add frames and branding on top of the video. Configure your overlays, then use Preview to see them applied over your Speed / Ramp settings. Scroll inside the screen to see everything.",hero:"<div class=\"aihero\"><div class=\"aieyebrow\">✦ AI Overlay <span>Pro</span></div><h3>Your event's frame, designed by AI<svg class=\"spark\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10 3l1.6 4.9L16.5 9.5l-4.9 1.6L10 16l-1.6-4.9L3.5 9.5l4.9-1.6z\"/><path d=\"M18 13l.9 2.6 2.6.9-2.6.9L18 20l-.9-2.6-2.6-.9 2.6-.9z\"/><path d=\"M18.5 2.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z\"/></svg></h3><p>Describe the event and AI designs the frame for you. A gold-and-white wedding, a neon birthday, a launch in brand colors: type the idea and in seconds you have a one-of-a-kind overlay made for that event. Name, date and logo are added separately, so they always look sharp and accurate.</p><div class=\"aishots\"><figure><img src=\"@aineon\" alt=\"\"><figcaption>“Neon party frame, pink and blue”</figcaption></figure><figure><img src=\"@aigold\" alt=\"\"><figcaption>“Elegant gold wedding frame with leaves”</figcaption></figure></div><div class=\"aifoot\"><span>Illustrative examples · Uses AI credits</span><button type=\"button\" class=\"aigo\" data-go=\"ov2\">See how it works →</button></div></div>",tip:""},
  es:{t:"2.6 Overlays",s:"Agrega marcos y branding encima del video. Configura tus overlays y usa Preview para verlos aplicados sobre tus ajustes de Speed / Ramp. Desliza dentro de la pantalla para ver todo.",hero:"<div class=\"aihero\"><div class=\"aieyebrow\">✦ AI Overlay <span>Pro</span></div><h3>El marco de tu evento, diseñado con IA<svg class=\"spark\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10 3l1.6 4.9L16.5 9.5l-4.9 1.6L10 16l-1.6-4.9L3.5 9.5l4.9-1.6z\"/><path d=\"M18 13l.9 2.6 2.6.9-2.6.9L18 20l-.9-2.6-2.6-.9 2.6-.9z\"/><path d=\"M18.5 2.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z\"/></svg></h3><p>Describe el evento y la IA diseña el marco por ti. Boda en dorado y blanco, cumpleaños neón, lanzamiento con los colores de la marca: escribe la idea y en segundos tienes un overlay único, hecho para ese evento. El nombre, la fecha y el logo se agregan aparte, así siempre se ven nítidos y correctos.</p><div class=\"aishots\"><figure><img src=\"@aineon\" alt=\"\"><figcaption>“Neon party frame, pink and blue”</figcaption></figure><figure><img src=\"@aigold\" alt=\"\"><figcaption>“Elegant gold wedding frame with leaves”</figcaption></figure></div><div class=\"aifoot\"><span>Ejemplos ilustrativos · Usa créditos de IA</span><button type=\"button\" class=\"aigo\" data-go=\"ov2\">Ver cómo funciona →</button></div></div>",tip:""},
  pins:[
   {x:92,yc:78.5,ai:true,bandPin:true,en:["AI Generate · Upload · Library","Three ways to get your Image Overlay. Tap AI Generate on the screen to open it."],es:["AI Generate · Upload · Library","Tres formas de conseguir tu overlay de imagen. Toca AI Generate en la pantalla para abrirlo."]},
   {x:46,y:18.9,en:["Image Overlay","A transparent PNG on top of the video, recommended 1080×1920 px (it follows your orientation). Choose how to get it in the row below."],es:["Overlay de imagen","Un PNG transparente encima del video, recomendado de 1080×1920 px (sigue tu orientación). Elige cómo conseguirlo en la fila de abajo."]},
   {x:37,y:34.2,en:["Position","Main video only puts the overlay on the 360 video. Full video also covers the Intro and Outro."],es:["Posición","Main video only pone el overlay solo en el video 360. Full video también lo pone en el intro y el outro."]},
   {x:38,y:42.7,en:["Preview","Shows the overlay applied over your Speed / Ramp configuration before the event."],es:["Vista previa","Muestra el overlay aplicado sobre tu configuración de Speed / Ramp antes del evento."]},
   {x:57,y:51.7,en:["Animated Overlay","Same idea as the Image Overlay, but animated: a transparent video layer (MOV/MP4 with alpha channel), recommended 1080×1920 px. In Library you'll find more than 50 animated overlays ready to use, or Upload your own. It has its own Position setting."],es:["Overlay animado","La misma idea que el overlay de imagen, pero animado: una capa de video transparente (MOV/MP4 con canal alfa), recomendada de 1080×1920 px. En Library encontrarás más de 50 overlays animados listos para usar, o sube el tuyo con Upload. Tiene su propio ajuste de posición."]},
   {x:45,y:78.9,en:["Intro & Outro","Short clips that play before and after the main video, in MP4 or JPG. For a JPG, set how long it displays; an MP4 uses its own length. The Intro, Outro and overlay sizes must match. Segment speeds and effects never apply to them."],es:["Intro y outro","Clips cortos que se reproducen antes y después del video principal, en MP4 o JPG. Para un JPG, define cuánto tiempo se muestra; un MP4 usa su propia duración. El tamaño del intro, el outro y el overlay debe coincidir. Las velocidades y efectos de los segmentos nunca se les aplican."]}
  ]},
 {id:"ov2",img:"ov2",tall:true,taps:[{x:5,y:4.6,w:20.7,h:2.6,go:"ov1"}],
  en:{t:"2.6 Overlays · Generate with AI",s:"Opens from AI Generate. Describe the design, add optional details, and generate. Tap Cancel to go back.",hero:"<div class=\"aihero slim\"><div class=\"aieyebrow\">✦ Prompt ideas</div><p>Tap one to copy it, then paste it in Describe Design and make it yours. Describe the style: theme, colors, mood. You don't need to explain sizes or where guests stand; the app adds those rules for you.</p><div class=\"pchips\"><button type=\"button\" class=\"pchip\">Elegant gold floral frame for a wedding, soft white glow</button><button type=\"button\" class=\"pchip\">Neon 80s party border, pink and blue</button><button type=\"button\" class=\"pchip\">Minimal modern frame with navy corporate accents</button><button type=\"button\" class=\"pchip\">Tropical leaves and sunset colors for a beach party</button><button type=\"button\" class=\"pchip\">Quinceañera frame in rose gold with sparkles</button></div></div>",tip:""},
  es:{t:"2.6 Overlays · Generar con IA",s:"Se abre desde AI Generate. Describe el diseño, agrega detalles opcionales y genera. Toca Cancel para regresar.",hero:"<div class=\"aihero slim\"><div class=\"aieyebrow\">✦ Ideas de prompts</div><p>Toca una para copiarla, pégala en Describe Design y ajústala a tu evento. Describe el estilo: tema, colores, ambiente. No necesitas explicar tamaños ni dónde van los invitados; la app agrega esas reglas por ti.</p><div class=\"pchips\"><button type=\"button\" class=\"pchip\">Elegant gold floral frame for a wedding, soft white glow</button><button type=\"button\" class=\"pchip\">Neon 80s party border, pink and blue</button><button type=\"button\" class=\"pchip\">Minimal modern frame with navy corporate accents</button><button type=\"button\" class=\"pchip\">Tropical leaves and sunset colors for a beach party</button><button type=\"button\" class=\"pchip\">Quinceañera frame in rose gold with sparkles</button></div></div>",tip:""},
  pins:[
   {x:93,y:9.5,en:["Size","The AI creates the overlay in your event's orientation and size, for example Portrait 1080×1920."],es:["Tamaño","La IA crea el overlay con la orientación y el tamaño de tu evento, por ejemplo vertical 1080×1920."]},
   {x:54,y:14.4,ai:true,en:["Describe Design","Write the style you want, for example “elegant gold wedding frame with roses”. The app adds the technical rules automatically, so you only describe the style."],es:["Describe el diseño","Escribe el estilo que quieres, por ejemplo “elegant gold wedding frame with roses”. La app agrega las reglas técnicas sola, así que solo describes el estilo."]},
   {x:73,y:24.5,en:["Style Reference (optional)","Upload an image and the AI generates a design closer to that style: a client's invitation, a mood board or a brand piece. It's optimized automatically before sending."],es:["Referencia de estilo (opcional)","Sube una imagen y la IA genera un diseño más cercano a ese estilo: la invitación del cliente, un mood board o una pieza de la marca. Se optimiza sola antes de enviarse."]},
   {x:61,y:36.1,en:["Add name & date","Add the names and the date. They are rendered by the app after the design is generated, so the text always comes out exact, with no typos."],es:["Agregar nombre y fecha","Agrega los nombres y la fecha. La app los pone después de generar el diseño, así el texto siempre sale exacto, sin errores."]},
   {x:27,y:49.4,en:["Position · Plate · Font","Choose where the text goes; the center stays free for your guests. Integrated plate: the AI creates a plate that matches the frame and places the name and date inside it. Free placement puts the text on its own. Then pick a font."],es:["Posición · Placa · Tipografía","Elige dónde va el texto; el centro queda libre para tus invitados. Integrated plate: la IA crea una placa que combina con el marco y pone el nombre y la fecha adentro. Free placement pone el texto suelto. Después elige la tipografía."]},
   {x:62,y:85.4,en:["Logo / Image (optional)","Add the client's logo or an image to the overlay. PNG or JPG; a transparent PNG works best."],es:["Logo / imagen (opcional)","Agrega el logo del cliente o una imagen al overlay. PNG o JPG; funciona mejor un PNG transparente."]},
   {x:72,y:93,ai:true,en:["Generate","Uses 3 AI credits, charged only after the overlay becomes a valid transparent PNG. Your balance is shown below. If Add name & date is on, fill in a name or date first, or turn it off. Your last AI generation is saved, so you can compare it with the new one."],es:["Generar","Usa 3 créditos de IA, que se cobran solo cuando el overlay queda como un PNG transparente válido. Tu saldo aparece abajo. Si Add name & date está activado, primero escribe un nombre o fecha, o desactívalo. Tu última generación con IA se guarda, para que puedas compararla con la nueva."]}
  ]},

 {id:"sh1",img:"sh1",tall:true,
  en:{t:"2.8 Sharing",s:"Choose how guests get their video and customize the email they receive. Scroll inside the screen to see everything, and tap any ? in the app for a quick explanation.",hero:"<div class=\"netnote\"><b>No internet? Nothing is lost.</b> QR, email and SMS shares wait in a queue, and the app syncs them automatically when you reconnect. AirDrop works without internet. In some cases you can also sync manually <a class=\"soonref\" href=\"#eventgallery\">(see Event Gallery › Sharing Queue)</a>.</div>",tip:""},
  es:{t:"2.8 Compartir",s:"Elige cómo reciben los invitados su video y personaliza el correo que les llega. Desliza dentro de la pantalla para ver todo y toca cualquier ? en la app para ver una explicación rápida.",hero:"<div class=\"netnote\"><b>¿Sin internet? No se pierde nada.</b> Lo que se comparte por QR, correo y SMS queda en cola, y la app lo sincroniza sola cuando vuelves a tener conexión. AirDrop funciona sin internet. En algunos casos también puedes sincronizar manualmente <a class=\"soonref\" href=\"#eventgallery\">(ver Galería del evento › Cola de envíos)</a>.</div>",tip:""},
  pins:[
   {x:44,y:18.1,en:["QR Code","Guests share their media quickly by scanning a QR code."],es:["Código QR","Los invitados comparten su video rápido escaneando un código QR."]},
   {x:41,y:26.9,en:["AirDrop","Guests share with AirDrop on iPhone, or Device Sharing on Android. Works without internet."],es:["AirDrop","Los invitados comparten con AirDrop en iPhone o con Device Sharing en Android. Funciona sin internet."]},
   {x:48,y:35.8,tier:"Pro",en:["SMS","Available only in some countries: if you don't see it, it isn't available in yours. It includes an initial number of SMS sends, and you can buy more SMS credits anytime."],es:["SMS","Disponible solo en algunos países: si no lo ves, no está disponible en el tuyo. Incluye un número inicial de envíos SMS y puedes comprar más créditos SMS cuando quieras."]},
   {x:37,y:44.7,en:["Email","Guests email their photos and videos instantly."],es:["Correo","Los invitados envían sus fotos y videos por correo al instante."]},
   {x:61.5,y:51,en:["Include Event Logo","Adds the event logo to the email."],es:["Incluir logo del evento","Agrega el logo del evento al correo."]},
   {x:75,y:56.1,en:["Header Image","The image at the top of the email. Any image works: it's resized to fit the email layout (long edge 1200 px) before upload."],es:["Imagen de encabezado","La imagen de arriba del correo. Funciona cualquier imagen: se ajusta al diseño del correo (lado largo de 1200 px) antes de subirse."]},
   {x:66,y:68,en:["Include Event Details","Adds the event details, such as the name and date, to the email."],es:["Incluir detalles del evento","Agrega los detalles del evento, como el nombre y la fecha, al correo."]},
   {x:57,y:72.9,en:["Sender name · Reply To","Sender name is who the email appears to come from, for emails sent from the app and the web: use your company name or your client's. Reply To is the email address that receives replies."],es:["Remitente · Responder a","El remitente es quien aparece como el que envía los correos de la app y la web: usa el nombre de tu empresa o el de tu cliente. Reply To es la dirección de correo que recibe las respuestas."]},

  pins:[

   {x:61,y:22.3,en:["Online Gallery","When it's off, the public link to the full gallery is restricted. Each guest's own link, shared by QR, email or SMS, still works."],es:["Galería en línea","Si está apagada, el enlace público a la galería completa queda restringido. El enlace de cada invitado, compartido por QR, correo o SMS, sigue funcionando."]},
   {x:79,y:30.4,en:["Gallery Access","Gallery Link: copy the link to the event gallery and send it to your client. Gallery QR: the event's general QR code, so anyone can open the full gallery. Manage Web: opens your online galleries on the web so you, the operator, can manage them."],es:["Acceso a la galería","Gallery Link: copia el enlace de la galería del evento para enviarlo a tu cliente. Gallery QR: el código QR general del evento, para que cualquiera abra la galería completa. Manage Web: abre tus galerías en línea en la web para que tú, como operador, las administres."]},
   {x:67.5,y:50.6,en:["Allow Downloads","When it's off, visitors can't download media from the public gallery."],es:["Permitir descargas","Si está apagado, los visitantes no pueden descargar fotos ni videos de la galería pública."]},
   {x:73,y:57.8,en:["Save Original Media","The processed video is always saved. When it's on, the raw capture is also kept in the event's Originals folder; reprocessing never changes or deletes it. Both folders are included in the event export."],es:["Guardar media original","El video procesado siempre se guarda. Si lo activas, la captura sin procesar también se guarda en la carpeta Originals del evento; volver a procesar nunca la cambia ni la borra. Las dos carpetas se incluyen al exportar el evento."]},
   {x:58.5,y:68.3,en:["Grid Columns","How many columns the gallery shows. Auto shows 3 on iPad and desktop, and 2 on phones."],es:["Columnas","Cuántas columnas muestra la galería. Auto muestra 3 en iPad y computadora, y 2 en teléfonos."]},
   {x:85,y:78.7,en:["Gallery Background Color","Background of the event gallery and the Share Station. Default uses the app's standard gradient; Fuchsia or Custom change it. The media cards keep their own style."],es:["Color de fondo de la galería","El fondo de la galería del evento y de la Share Station. Default usa el degradado de la app; Fuchsia o Custom lo cambian. Las tarjetas de fotos y videos conservan su estilo."]},
   {x:64.5,y:91.5,en:["View Gallery in Guest Mode","Adds a View Gallery shortcut at the top right of the start screen and the experience selector, so guests can browse the gallery from the kiosk."],es:["Ver galería en modo invitado","Agrega un acceso directo View Gallery arriba a la derecha de la pantalla de inicio y del selector de experiencias, para que los invitados vean la galería desde el kiosko."]},
   {x:50,y:98.6,en:["Gallery PIN","Below, you can require a 6-digit PIN to open the public gallery. Visitors must enter it before they see any media."],es:["PIN de la galería","Más abajo puedes pedir un PIN de 6 dígitos para abrir la galería pública. Los visitantes deben escribirlo antes de ver cualquier foto o video."]}
  ]},

   {x:63,y:75.2,go:"lg1",en:["Slideshow & Branding","Timing, transitions, branding and the QR overlay are set in Gallery Settings › Live Gallery when you create or edit the event. Tap this card on the screen to go there.","Go to Live Gallery settings"],es:["Slideshow y branding","Los tiempos, transiciones, branding y el QR se configuran en Gallery Settings › Live Gallery al crear o editar el evento. Toca esta tarjeta en la pantalla para ir ahí.","Ir a ajustes de Live Gallery"]},

 {id:"ss1",img:"ss1",tall:true,
  en:{t:"2.10 Share Station",s:"Use a second device as a station where guests view and share their videos, while the booth keeps recording. Scroll inside the screen to see all the settings.",hero:"<div class=\"sshero\"><div class=\"aieyebrow\">Share Station <span>Enterprise</span></div><h3>Two devices, one event</h3><div class=\"devflow\"><div class=\"dev dphone\"><div class=\"scr\"><i class=\"rec\"></i></div><b>Device 1</b><small>iPhone or iPad · Booth</small><em>Records the 360 video</em></div><div class=\"flowarrow\"><span>Same account · Same event</span><svg viewBox=\"0 0 120 24\" aria-hidden=\"true\"><path d=\"M2 12h110\" stroke-dasharray=\"5 5\"/><path d=\"M104 5l10 7-10 7\"/></svg></div><div class=\"dev dtablet\"><div class=\"ipad\"><span class=\"cam\"></span><div class=\"scr grid\"><i class=\"v1\"></i><i class=\"v2\"></i><i class=\"v3\"></i><i class=\"v4\"></i><i class=\"v5\"></i><i class=\"v6\"></i></div></div><b>Device 2</b><small>iPad or iPhone · Share Station</small><em>Guests view and share</em></div></div><div class=\"netnote ssnet\"><b>Both devices need internet.</b> Device 1 and device 2 must be online so the videos reach the Share Station.</div><div class=\"sshead\">How to set it up</div><ol class=\"sssteps\"><li>On <b>device 1</b>, where you set up the event, turn on <b>Enable Share Station</b> and tap Confirm.</li><li>On device 1, start the event. When the window appears, choose <b>Capture Station</b> (this device only records) or <b>Everything</b> (it records and guests can also share here).</li><li>On <b>device 2</b>, download Selfie Booth AI and sign in with the <b>same email and password</b>.</li><li>On device 2, open the <b>same event</b> and choose <b>Share Station</b>.</li><li>If you turned on Input PIN, enter the 6-digit PIN.</li><li>Device 2 switches to <b>kiosk mode</b> and receives each new photo, video and GIF automatically, so guests can view and share them.</li></ol></div>",tip:""},
  es:{t:"2.10 Share Station",s:"Usa un segundo dispositivo como estación donde los invitados ven y comparten sus videos, mientras el booth sigue grabando. Desliza dentro de la pantalla para ver todos los ajustes.",hero:"<div class=\"sshero\"><div class=\"aieyebrow\">Share Station <span>Enterprise</span></div><h3>Dos dispositivos, un evento</h3><div class=\"devflow\"><div class=\"dev dphone\"><div class=\"scr\"><i class=\"rec\"></i></div><b>Dispositivo 1</b><small>iPhone o iPad · Booth</small><em>Graba el video 360</em></div><div class=\"flowarrow\"><span>Misma cuenta · Mismo evento</span><svg viewBox=\"0 0 120 24\" aria-hidden=\"true\"><path d=\"M2 12h110\" stroke-dasharray=\"5 5\"/><path d=\"M104 5l10 7-10 7\"/></svg></div><div class=\"dev dtablet\"><div class=\"ipad\"><span class=\"cam\"></span><div class=\"scr grid\"><i class=\"v1\"></i><i class=\"v2\"></i><i class=\"v3\"></i><i class=\"v4\"></i><i class=\"v5\"></i><i class=\"v6\"></i></div></div><b>Dispositivo 2</b><small>iPad o iPhone · Share Station</small><em>Los invitados ven y comparten</em></div></div><div class=\"netnote ssnet\"><b>Los dos dispositivos necesitan internet.</b> El dispositivo 1 y el dispositivo 2 deben estar conectados para que los videos lleguen a la Share Station.</div><div class=\"sshead\">Cómo configurarlo</div><ol class=\"sssteps\"><li>En el <b>dispositivo 1</b>, donde configuras el evento, activa <b>Enable Share Station</b> y toca Confirm.</li><li>En el dispositivo 1, inicia el evento. Cuando aparezca la ventana, elige <b>Capture Station</b> (solo graba) o <b>Everything</b> (graba y los invitados también pueden compartir ahí).</li><li>En el <b>dispositivo 2</b>, descarga Selfie Booth AI e inicia sesión con el <b>mismo correo y contraseña</b>.</li><li>En el dispositivo 2, abre el <b>mismo evento</b> y elige <b>Share Station</b>.</li><li>Si activaste Input PIN, escribe el PIN de 6 dígitos.</li><li>El dispositivo 2 entra en <b>modo kiosko</b> y recibe solo cada foto, video y GIF nuevo, para que los invitados los vean y compartan.</li></ol></div>",tip:""},

   {x:58,y:52.3,en:["Guest Messages","Texts shown on the Share Station. Welcome: when a guest walks up. Empty Gallery: when there's nothing to share yet. Processing: while it prepares media or contacts a sharing service. Sharing Success: when an email, SMS or AirDrop share completes. Sharing Error: when sharing fails. Leave any field blank to use the app's default text."],es:["Mensajes para invitados","Los textos que muestra la Share Station. Welcome: cuando llega un invitado. Empty Gallery: cuando todavía no hay nada que compartir. Processing: mientras prepara el contenido o se conecta al servicio de envío. Sharing Success: cuando se completa un envío por correo, SMS o AirDrop. Sharing Error: cuando el envío falla. Deja cualquier campo vacío para usar el texto de la app."]}

  en:{t:"5 Event Gallery · Open it",s:"Check sends, recover the queue and download everything from the event's gallery. On the events screen, tap the event's ⋮ menu and choose Gallery. During the event you can also open it from the gallery icon at the top right of the start screen (see <a href=\"#quick\">Quick access</a>).",hero:"<div class=\"scenbox\"><div class=\"scenhead\"><b>Common situations</b> Tap one to jump to the right screen. Path: event ⋮ › Gallery.</div><div class=\"scengrid\"><button type=\"button\" class=\"scen aigo2\" data-go=\"eg2b\"><b>A guest comes back for their video</b><span>Find it in the gallery and share it again from its ⋮ menu.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg7\"><b>A guest didn't get their QR or email</b><span>Check the status of each send in Sharing Queue.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg5\"><b>Recover what stayed in the queue</b><span>Auto-sync handles it; Sync Now and Retry Failed if you need it now.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg4\"><b>Download the full event gallery</b><span>All photos and videos in one ZIP for your client.</span></button><button type=\"button\" class=\"scen aigo2\" data-go=\"eg8\"><b>Manage your galleries on the web</b><span>Sign in as the operator from any computer.</span></button></div></div>",tip:""},
